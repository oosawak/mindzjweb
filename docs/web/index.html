<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>MindZJWeb — Vault Viewer</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.6 Inter, ui-sans-serif, system-ui, sans-serif; color: #e5e7eb; background: #111318; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 290px minmax(0, 1fr); }
    aside { min-width: 0; display: flex; flex-direction: column; padding: 16px 12px; background: #171a21; border-right: 1px solid #292e38; }
    .brand { padding: 0 9px 15px; font-size: 21px; font-weight: 750; letter-spacing: -.04em; }
    .brand span { color: #65a4ff; }
    .toolbar { display: grid; gap: 8px; padding: 0 4px 12px; }
    .search, .field, textarea { width: 100%; border: 1px solid #343b49; border-radius: 7px; padding: 8px 10px; color: #e5e7eb; background: #11151c; outline: none; }
    textarea { min-height: 130px; resize: vertical; }
    .add { width: 100%; border: 1px solid #3d5272; border-radius: 7px; padding: 8px 10px; color: #b8d4ff; background: #1a2432; cursor: pointer; text-align: left; }
    .add:hover { background: #243247; }
    .note-list { min-height: 0; flex: 1; overflow: auto; }
    .section { margin: 12px 8px 5px; color: #858d9b; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; }
    .note { width: 100%; border: 0; border-radius: 7px; padding: 7px 9px; text-align: left; color: #cbd2de; background: transparent; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note:hover, .note.active { color: #fff; background: #252b36; }
    main { min-width: 0; display: flex; flex-direction: column; }
    header { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 24px; border-bottom: 1px solid #292e38; color: #9ca6b5; font-size: 12px; }
    .pill { flex-shrink: 0; border: 1px solid #3d5272; border-radius: 99px; padding: 3px 9px; color: #8dbaff; font-size: 10px; }
    .notice { margin: 14px auto 0; width: min(860px, calc(100% - 40px)); padding: 9px 12px; border: 1px solid #354257; border-radius: 8px; color: #aebbd0; background: #191f29; font-size: 11px; }
    .content { width: min(860px, 100%); flex: 1; margin: 0 auto; padding: 28px 34px 70px; overflow-wrap: anywhere; }
    .content h1 { margin: 0 0 24px; font-size: clamp(27px, 4vw, 40px); line-height: 1.2; letter-spacing: -.035em; }
    .content h2 { margin-top: 34px; padding-bottom: 6px; border-bottom: 1px solid #2c3440; }
    .content h3 { margin-top: 26px; }
    .content p { line-height: 1.85; }
    .content a { color: #8dbaff; }
    .content img { display: block; max-width: 100%; max-height: 75vh; margin: 16px 0; border-radius: 7px; object-fit: contain; }
    .content table { width: 100%; border-collapse: collapse; margin: 18px 0; }
    .content th, .content td { padding: 8px 10px; border: 1px solid #39414e; text-align: left; vertical-align: top; }
    .content th { background: #1b222d; }
    .content pre { overflow: auto; padding: 14px; border: 1px solid #2e3540; border-radius: 8px; background: #0b0d11; }
    .content code { padding: 2px 4px; border-radius: 4px; background: #242a34; }
    .content pre code { padding: 0; background: transparent; }
    .content blockquote { margin-left: 0; padding-left: 14px; border-left: 3px solid #5475a3; color: #aab3c2; }
    .html-embed { width: 100%; height: min(70vh, 720px); min-height: 320px; overflow: hidden; border: 1px solid #343b49; border-radius: 8px; }
    .html-embed iframe { width: 100%; height: 100%; border: 0; background: white; }
    .form { display: grid; gap: 8px; padding: 10px 5px; }
    .form button { border: 1px solid #3d5272; border-radius: 7px; padding: 8px; color: #d9e8ff; background: #243247; cursor: pointer; }
    .empty { color: #8993a2; padding: 35px 10px; text-align: center; }
    @media (max-width: 740px) { .app { grid-template-columns: 1fr; } aside { max-height: 43vh; border-right: 0; border-bottom: 1px solid #292e38; } .note-list { max-height: 24vh; } .content { padding: 25px 20px 60px; } header { padding: 10px 14px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">MindZJ<span>Web</span></div>
      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="ノートを検索" aria-label="ノートを検索">
        <button id="show-form" class="add" type="button">＋ サンプルにノートを追加</button>
        <form id="sample-form" class="form" hidden>
          <input id="sample-title" class="field" maxlength="120" placeholder="タイトル" required>
          <textarea id="sample-body" class="field" placeholder="Markdown の内容"></textarea>
          <button type="submit">ブラウザーに保存</button>
        </form>
      </div>
      <nav id="notes" class="note-list" aria-label="Vault ノート一覧"></nav>
    </aside>
    <main>
      <header><span id="location">公開 Vault</span><span class="pill">閲覧専用 · サンプルはこのブラウザーに保存</span></header>
      <div class="notice">公開 Vault の内容は閲覧専用です。「サンプルにノートを追加」で作ったノートはこのブラウザーだけに保存され、GitHub 上の Vault は変更されません。</div>
      <article id="content" class="content"><div class="empty">Vault のノートを読み込み中…</div></article>
    </main>
  </div>
  <script>
    const storageKey = "mindzjweb-pages-sample-notes-v1";
    const list = document.querySelector("#notes");
    const content = document.querySelector("#content");
    const search = document.querySelector("#search");
    const form = document.querySelector("#sample-form");
    const samples = loadSamples();
    let documents = [];
    let publishedFiles = new Set();
    let selected = null;

    function loadSamples() {
      try { const value = JSON.parse(localStorage.getItem(storageKey) || "[]"); return Array.isArray(value) ? value : []; }
      catch { return []; }
    }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]); }
    function assetPath(path, from = "") {
      const clean = path.replaceAll("\\", "/").trim();
      const vault = from.split("/")[0] || "";
      const vaultCandidate = vault ? `${vault}/${clean.replace(/^\//, "")}` : clean.replace(/^\//, "");
      let resolved;
      if (clean.startsWith("/")) resolved = vaultCandidate;
      else if (publishedFiles.has(clean)) resolved = clean;
      else if (publishedFiles.has(vaultCandidate)) resolved = vaultCandidate;
      else {
        const parts = from ? from.split("/").slice(0, -1) : [];
        for (const part of clean.split("/")) {
          if (!part || part === ".") continue;
          if (part === "..") parts.pop(); else parts.push(part);
        }
        resolved = parts.join("/");
      }
      const parts = [];
      for (const part of resolved.split("/")) {
        if (!part || part === ".") continue;
        if (part === "..") parts.pop(); else parts.push(part);
      }
      return "./docs/" + parts.map(encodeURIComponent).join("/");
    }
    function inline(markdown, sourcePath) {
      let text = escapeHtml(markdown);
      text = text.replace(/!\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, raw, label) => {
        const path = raw.trim().replace(/^\//, "");
        if (/\.html?$/i.test(path)) return `<div class="html-embed"><iframe src="${assetPath(path, sourcePath)}" title="${escapeHtml(label || path)}" sandbox="allow-scripts allow-forms allow-popups allow-downloads" referrerpolicy="no-referrer"></iframe></div>`;
        return `![[${escapeHtml(raw)}]]`;
      });
      text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, path) => `<img src="${assetPath(path, sourcePath)}" alt="${alt}">`);
      text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, path) => {
        const href = /^https?:\/\//i.test(path) ? path : assetPath(path, sourcePath);
        return `<a href="${href}" target="_blank" rel="noopener">${label}</a>`;
      });
      text = text.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
      text = text.replace(/(?<!["'=])\b(https?:\/\/[^\s<]+)/g, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
      return text;
    }
    function renderMarkdown(markdown, sourcePath = "") {
      const lines = markdown.replaceAll("\r", "").split("\n");
      const output = [];
      for (let i = 0; i < lines.length;) {
        const line = lines[i];
        if (!line.trim()) { i++; continue; }
        if (/^```/.test(line)) {
          i++; const code = [];
          while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
          i++; output.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`); continue;
        }
        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) { const n = heading[1].length; output.push(`<h${n}>${inline(heading[2], sourcePath)}</h${n}>`); i++; continue; }
        if (i + 1 < lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
          const cells = value => value.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
          const headers = cells(line); i += 2; const rows = [];
          while (i < lines.length && lines[i].includes("|")) rows.push(cells(lines[i++]));
          output.push(`<table><thead><tr>${headers.map(c => `<th>${inline(c, sourcePath)}</th>`).join("")}</tr></thead><tbody>${rows.map(row => `<tr>${headers.map((_, index) => `<td>${inline(row[index] || "", sourcePath)}</td>`).join("")}</tr>`).join("")}</tbody></table>`); continue;
        }
        if (/^>\s?/.test(line)) { const quote = []; while (i < lines.length && /^>\s?/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, "")); output.push(`<blockquote>${quote.map(x => `<p>${inline(x, sourcePath)}</p>`).join("")}</blockquote>`); continue; }
        if (/^\s*[-*+]\s+/.test(line)) { const items = []; while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*+]\s+/, "")); output.push(`<ul>${items.map(x => `<li>${inline(x, sourcePath)}</li>`).join("")}</ul>`); continue; }
        if (/^\s*\d+\.\s+/.test(line)) { const items = []; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*\d+\.\s+/, "")); output.push(`<ol>${items.map(x => `<li>${inline(x, sourcePath)}</li>`).join("")}</ol>`); continue; }
        const paragraph = [line]; i++;
        while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|>\s?|\s*[-*+]\s+|\s*\d+\.\s+)/.test(lines[i])) paragraph.push(lines[i++]);
        output.push(`<p>${paragraph.map(x => inline(x, sourcePath)).join("<br>")}</p>`);
      }
      return output.join("\n");
    }
    function visibleDocs() {
      const query = search.value.trim().toLocaleLowerCase();
      return documents.filter(note => !query || `${note.title} ${note.path}`.toLocaleLowerCase().includes(query));
    }
    function renderList() {
      list.replaceChildren();
      const published = visibleDocs();
      if (published.length) {
        const heading = document.createElement("div"); heading.className = "section"; heading.textContent = "Published Vault"; list.append(heading);
        for (const note of published) {
          const button = document.createElement("button"); button.type = "button"; button.className = `note${selected?.path === note.path ? " active" : ""}`; button.textContent = note.title; button.title = note.path;
          button.onclick = () => openDocument(note); list.append(button);
        }
      }
      if (samples.length) {
        const heading = document.createElement("div"); heading.className = "section"; heading.textContent = "Browser samples"; list.append(heading);
        for (const note of samples) {
          const button = document.createElement("button"); button.type = "button"; button.className = `note${selected?.id === note.id ? " active" : ""}`; button.textContent = note.title; button.onclick = () => openSample(note); list.append(button);
        }
      }
      if (!published.length && !samples.length) list.innerHTML = '<div class="empty">ノートがありません</div>';
    }
    async function openDocument(note) {
      selected = note; renderList(); document.querySelector("#location").textContent = note.path;
      content.innerHTML = '<div class="empty">読み込み中…</div>';
      try {
        const response = await fetch(assetPath(note.path));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const markdown = await response.text();
        const firstHeading = markdown.match(/^#\s+(.+)$/m);
        const title = firstHeading?.[1] || note.title;
        content.innerHTML = `<h1>${escapeHtml(title)}</h1>${renderMarkdown(markdown.replace(/^#\s+.+\n?/, ""), note.path)}`;
      } catch (error) { content.innerHTML = `<div class="empty">ノートを読み込めませんでした: ${escapeHtml(error.message)}</div>`; }
    }
    function openSample(note) {
      selected = note; renderList(); document.querySelector("#location").textContent = `Browser samples / ${note.title}`;
      content.innerHTML = `<h1>${escapeHtml(note.title)}</h1>${renderMarkdown(note.body || "")}`;
    }
    search.addEventListener("input", renderList);
    document.querySelector("#show-form").onclick = () => { form.hidden = !form.hidden; if (!form.hidden) document.querySelector("#sample-title").focus(); };
    form.addEventListener("submit", event => {
      event.preventDefault();
      const title = document.querySelector("#sample-title").value.trim();
      const body = document.querySelector("#sample-body").value;
      if (!title) return;
      const note = { id: crypto.randomUUID(), title, body };
      samples.unshift(note); localStorage.setItem(storageKey, JSON.stringify(samples));
      form.reset(); form.hidden = true; openSample(note);
    });
    fetch("./manifest.json").then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); }).then(manifest => {
      documents = manifest.notes || []; publishedFiles = new Set(manifest.files || []); renderList();
      if (documents.length) {
        const first = documents.find(note => note.path.endsWith("ドキュメント/教科書/UnrealEngine入門.md")) || documents[0];
        openDocument(first);
      } else { content.innerHTML = '<div class="empty">公開 Vault に Markdown ノートがありません。</div>'; }
    }).catch(error => { content.innerHTML = `<div class="empty">Vault の一覧を読み込めませんでした: ${escapeHtml(error.message)}</div>`; });
    renderList();
  </script>
</body>
</html>
