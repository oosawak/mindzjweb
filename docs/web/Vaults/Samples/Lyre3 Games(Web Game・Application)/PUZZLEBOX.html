<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animal Hunt</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Denk+One&display=swap');

  :root {
    --main-bg: #f5f5f0;
    --primary-bg: #e8e8e0;
    --primary-text: #333333;
  }

  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100vh; min-height: 100dvh;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: 'Denk One', sans-serif;
    background: var(--main-bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: background 0.4s;
  }

  #gameWrapper {
    width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none;
    position: relative; z-index: 50;
    perspective: 1200px;
  }

  #gameCanvas {
    transform: rotateX(6deg);
  }

  canvas {
    display: block; width: 100%; height: 100%;
    position: absolute; top: 0; left: 0; touch-action: none;
  }
  #gameCanvas { transform: rotateX(6deg); }

  #lidOverlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: transparent;
    border-radius: 0;
    box-shadow: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
    z-index: 100; touch-action: none; pointer-events: auto;
    overflow: hidden;
    transform: rotateX(6deg);
  }
  .lid-title-15 {
    font-size: clamp(38px, 10vmin, 58px); line-height: 1;
    color: var(--primary-text);
    text-shadow: -3px -3px 6px rgba(255,255,255,0.8), 6px 6px 10px rgba(0,0,0,0.4);
    margin: 0 0 8px 0;
    animation: pulse15 3s ease-in-out infinite;
  }
  @keyframes pulse15 {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  .lid-title-text {
    font-size: clamp(18px, 4.5vmin, 28px); line-height: 1;
    color: var(--primary-text);
    text-shadow: -3px -3px 5px rgba(255,255,255,0.8), 5px 5px 8px rgba(0,0,0,0.4);
    margin-bottom: clamp(6px, 1.5vmin, 10px); letter-spacing: 2px; margin-top: 0;
    animation: fadeSlideIn 0.8s ease both;
  }
  .menu-subtitle {
    margin: 0 0 clamp(14px, 3vmin, 22px) 0;
    padding: 0 12px;
    color: var(--primary-text);
    font-size: clamp(12px, 2.7vmin, 16px);
    line-height: 1.35;
    text-align: center;
    opacity: 0.78;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
    animation: fadeSlideIn 0.8s ease both;
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Floating particles canvas */
  #menuParticles {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 24px; pointer-events: none; z-index: 99;
  }

  .game-btn {
    background: var(--primary-bg); border: none; font-family: 'Denk One', sans-serif;
    color: var(--primary-text); border-radius: 12px;
    box-shadow: inset 2px 2px 5px rgba(255,255,255,0.6), inset -2px -2px 5px rgba(0,0,0,0.3), 3px 3px 8px rgba(0,0,0,0.4);
    cursor: pointer; text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
    pointer-events: auto; transition: background 0.3s, color 0.3s;
  }
  .game-btn:active {
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3), inset -2px -2px 5px rgba(255,255,255,0.6), 1px 1px 3px rgba(0,0,0,0.4);
    transform: translateY(2px);
  }

  #topBtnHtml {
    position: absolute; top: 24px; left: 22px; z-index: 105;
    width: 58px; height: 58px; padding: 0;
    display: none; justify-content: center; align-items: center; border-radius: 12px;
    font-size: 13px; letter-spacing: 1px;
  }

  #pauseBtnHtml {
    position: absolute; top: 24px; left: 92px; z-index: 105;
    width: 58px; height: 58px; padding: 0;
    display: none; justify-content: center; align-items: center; border-radius: 12px;
  }

  .icon-btn-group {
    position: absolute; top: 24px; right: 22px; z-index: 105;
    display: flex; gap: 12px; pointer-events: auto;
  }
  .icon-btn {
    background: transparent; border: none; font-size: 36px; cursor: pointer;
    color: var(--primary-text); opacity: 0.78; transition: color 0.3s, opacity 0.3s, transform 0.2s;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.25); pointer-events: auto;
    width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: var(--primary-text); opacity: 1; transform: scale(1.1); }

  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 1000;
    display: none; align-items: center; justify-content: center; touch-action: none;
  }
  .overlay.active { display: flex; }

  #clearOverlay {
    cursor: pointer;
    background: transparent;
  }
  #clearOverlay .panel {
    gap: 18px;
    text-align: center;
  }
  .clear-title {
    font-size: clamp(34px, 8vmin, 54px);
    color: var(--primary-text);
    text-shadow: -2px -2px 5px rgba(255,255,255,0.75), 5px 5px 8px rgba(0,0,0,0.35);
    animation: pulse15 1.4s ease-in-out infinite;
  }
  .clear-subtitle {
    font-size: 16px;
    color: var(--primary-text);
    opacity: 0.8;
  }

  .panel {
    background: var(--primary-bg); border-radius: 16px;
    padding: 28px 24px;
    box-shadow: inset 4px 4px 10px rgba(255,255,255,0.6), inset -4px -4px 10px rgba(0,0,0,0.4), 10px 10px 20px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; align-items: center;
    gap: 14px;
    z-index: 1001; width: 420px; max-width: 90%;
    max-height: 720px;
    overflow-y: auto; box-sizing: border-box;
  }
  .panel h2 { margin: 0; font-size: 32px; color: var(--primary-text); text-shadow: 1px 1px 2px rgba(255,255,255,0.5); }
  .panel h3 { margin: 0; font-size: 18px; color: var(--primary-text); }
  #settingsOverlay .panel {
    width: 420px;
    max-height: min(720px, 92dvh);
    padding: 14px 18px 10px;
    gap: 8px;
    position: relative;
  }
  #closeSettingsBtnHtml {
    position: sticky;
    bottom: 0;
    z-index: 2;
    margin-top: 2px;
    width: 100%;
    flex: 0 0 auto;
  }
  .credits-note {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    border-radius: 8px;
    background: rgba(0,0,0,0.10);
    color: var(--primary-text);
    font-size: 11px;
    line-height: 1.25;
    text-align: left;
  }
  .credits-note strong {
    font-size: 13px;
  }

  .pause-btn {
    background: var(--primary-bg); border: none; font-family: 'Denk One', sans-serif;
    font-size: 18px; color: var(--primary-text);
    padding: 14px 28px;
    border-radius: 8px; width: 100%;
    box-shadow: inset 2px 2px 5px rgba(255,255,255,0.6), inset -2px -2px 5px rgba(0,0,0,0.3), 3px 3px 8px rgba(0,0,0,0.4);
    cursor: pointer; text-shadow: 1px 1px 2px rgba(255,255,255,0.5); pointer-events: auto;
    transition: background 0.3s, color 0.3s; box-sizing: border-box;
  }
  .pause-btn:active {
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3), inset -2px -2px 5px rgba(255,255,255,0.6);
    transform: translateY(2px);
  }

  .level-btn {
    background: var(--primary-bg); border: none; font-family: 'Denk One', sans-serif;
    font-size: 22px; color: var(--primary-text);
    padding: 14px 18px;
    border-radius: 12px; flex: 1 1 40%;
    box-shadow: inset 2px 2px 5px rgba(255,255,255,0.6), inset -2px -2px 5px rgba(0,0,0,0.3), 3px 3px 8px rgba(0,0,0,0.4);
    cursor: pointer; text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
    pointer-events: auto; font-weight: bold; transition: background 0.3s, color 0.3s;
  }
  .level-btn:active {
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3), inset -2px -2px 5px rgba(255,255,255,0.6);
    transform: translateY(2px);
  }

  #levelSelect {
    display: none; gap: 16px; flex-wrap: wrap;
    justify-content: center; width: 85%; max-width: 280px;
  }

  .menu-back-btn {
    display: none;
    margin-top: 16px;
    width: min(260px, 85%);
    font-size: 16px;
    padding: 12px 18px;
  }

  .game-select {
    display: grid;
    grid-template-columns: repeat(2, clamp(132px, 30vmin, 164px));
    gap: clamp(14px, 3vmin, 20px);
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 360px;
  }
  .game-choice {
    width: 100%;
    aspect-ratio: 1 / 1;
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.05;
    font-size: clamp(13px, 3vmin, 17px);
  }

  .choice-title {
    display: block;
  }
  .choice-icons {
    display: block;
    margin-top: 7px;
    font-size: clamp(19px, 4.5vmin, 25px);
    letter-spacing: 2px;
    line-height: 1;
  }

  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 4px 0;
  }
  .setting-row label { font-size: 18px; color: var(--primary-text); }
  .toggle {
    width: 58px; height: 30px; border-radius: 15px; cursor: pointer; border: none;
    background: rgba(0,0,0,0.25); position: relative; transition: background 0.3s;
    box-shadow: inset 2px 2px 4px rgba(0,0,0,0.4), inset -1px -1px 3px rgba(255,255,255,0.2);
  }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--primary-text); transition: transform 0.3s;
    box-shadow: 1px 1px 3px rgba(0,0,0,0.4);
  }
  .toggle.on { background: rgba(0,0,0,0.5); }
  .toggle.on::after { transform: translateX(28px); }

  .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .theme-btn {
    background: var(--primary-bg); border: none; font-family: 'Denk One', sans-serif;
    font-size: 16px; color: var(--primary-text); padding: 12px 8px;
    border-radius: 8px; cursor: pointer;
    box-shadow: inset 2px 2px 5px rgba(255,255,255,0.6), inset -2px -2px 5px rgba(0,0,0,0.3), 3px 3px 8px rgba(0,0,0,0.4);
    text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
    transition: background 0.3s, color 0.3s; pointer-events: auto;
  }
  .theme-btn:active { transform: translateY(2px); }
  .theme-btn.selected {
    box-shadow: inset 3px 3px 6px rgba(0,0,0,0.5), inset -1px -1px 3px rgba(255,255,255,0.2);
    opacity: 0.8;
  }

  #winOverlay .panel { width: 440px; }
  .score-box {
    width: 100%; background: rgba(0,0,0,0.15); border-radius: 8px; padding: 14px;
    box-shadow: inset 2px 2px 6px rgba(0,0,0,0.4), inset -1px -1px 3px rgba(255,255,255,0.1);
  }
  .score-box h3 { margin-bottom: 12px; font-size: 18px; }
  .score-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-bottom: 1px dashed rgba(0,0,0,0.2); font-size: 15px;
    color: var(--primary-text);
  }
  .score-row.highlight { font-weight: bold; font-size: 16px; }
  .current-result {
    width: 100%; background: var(--primary-bg); border-radius: 8px; padding: 14px;
    text-align: center;
    box-shadow: inset 2px 2px 5px rgba(255,255,255,0.6), inset -2px -2px 5px rgba(0,0,0,0.3), 3px 3px 8px rgba(0,0,0,0.4);
  }
  .current-result .label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .current-result .value { font-size: 28px; font-weight: bold; color: var(--primary-text); }

  .divider { width: 100%; height: 1px; background: rgba(0,0,0,0.15); }

  #confettiCanvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
  }

  .settings-puzzle-preview {
    width: min(210px, 62%);
    aspect-ratio: 1 / 0.88;
    padding: 6px 8px 7px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    box-sizing: border-box;
    background: var(--primary-bg);
    border: none;
    border-radius: 14px;
    box-shadow: inset 2px 2px 5px rgba(255,255,255,0.6), inset -2px -2px 5px rgba(0,0,0,0.3), 3px 3px 8px rgba(0,0,0,0.4);
    text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
  }
  .settings-puzzle-title {
    display: block;
    margin: 0;
    font-size: clamp(16px, 3.4vmin, 21px);
    line-height: 0.95;
    letter-spacing: 1px;
    color: var(--primary-text);
  }
  .settings-icon-grid {
    flex: 0 0 auto;
    width: auto;
    max-width: none;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(3, max-content);
    grid-template-rows: repeat(3, max-content);
    align-items: center;
    justify-items: center;
    gap: 5px 4px;
  }
  .settings-icon-cell {
    width: auto;
    height: auto;
    aspect-ratio: auto;
    padding: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    font-size: clamp(19px, 4.1vmin, 25px);
    line-height: 0.82;
  }
  body.escape-building, body.escape-building * {
    cursor: wait !important;
  }

  #escapeLoading {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    z-index: 1200; pointer-events: auto;
    background: rgba(0,0,0,0.25);
  }
  #escapeLoading.active { display: flex; }
  .escape-loading-box {
    min-width: 190px;
    padding: 18px 20px;
    border-radius: 16px;
    background: rgba(255,255,255,0.88);
    color: var(--primary-text);
    box-shadow: 0 10px 24px rgba(0,0,0,0.24);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    font-size: 14px;
  }
  .escape-spinner {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 5px solid rgba(0,0,0,0.14);
    border-top-color: var(--primary-text);
    animation: escapeSpin 0.8s linear infinite;
  }
  @keyframes escapeSpin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<button id="topBtnHtml" class="game-btn">TOP</button>

<body>

<button id="pauseBtnHtml" class="game-btn">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
    <rect x="6" y="4" width="4" height="16" rx="1"/>
    <rect x="14" y="4" width="4" height="16" rx="1"/>
  </svg>
</button>

<div class="icon-btn-group">
  <button class="icon-btn" id="hintBtnHtml" style="display:none; opacity:0.5;">💡</button>
  <button class="icon-btn" id="settingsBtnHtml">⚙️</button>
</div>

<canvas id="confettiCanvas"></canvas>

<!-- PAUSE -->
<div class="overlay" id="pauseOverlay">
  <div class="panel">
    <h2>PAUSED</h2>
    <button class="pause-btn" id="resumeBtnHtml">RESUME</button>
    <button class="pause-btn" id="mainMenuBtnHtml">MAIN MENU</button>
  </div>
</div>

<!-- CLEAR MESSAGE -->
<div class="overlay" id="clearOverlay">
  <div class="panel">
    <div class="clear-title">GAME CLEAR!</div>
    <div class="clear-subtitle">Click to see results</div>
  </div>
</div>

<!-- WIN -->
<div class="overlay" id="winOverlay">
  <div class="panel">
    <h2>ALL FOUND!</h2>
    <div class="score-box">
      <h3 id="bestResultsTitle">BEST RESULTS</h3>
      <div id="leaderboardList"></div>
    </div>
    <div class="current-result">
      <div class="label">YOUR RESULT</div>
      <div class="value" id="currentResultDisplay">0:00</div>
    </div>
    <button class="pause-btn" id="winNewGameBtn">NEW GAME</button>
    <button class="pause-btn" id="winMainMenuBtn">MAIN MENU</button>
  </div>
</div>

<!-- SETTINGS -->
<div class="overlay" id="settingsOverlay">
  <div class="panel">
    <h2>SETTINGS</h2>
    <div class="setting-row">
      <label>Sound</label>
      <button class="toggle on" id="soundToggle"></button>
    </div>
    <div class="setting-row">
      <label>Highlight Correct</label>
      <button class="toggle" id="hintToggle"></button>

    <div class="theme-grid">
      <button class="theme-btn" data-theme="plastic">Plastic</button>
      <button class="theme-btn" data-theme="wooden">Wooden</button>
      <button class="theme-btn" data-theme="metallic">Metal</button>
      <button class="theme-btn" data-theme="neon">Neon</button>
      <button class="theme-btn" data-theme="ocean">Ocean</button>
      <button class="theme-btn selected" data-theme="minimal">Minimal</button>

    <div class="settings-puzzle-preview" aria-label="Puzzle Box icon preview">
      <div class="settings-puzzle-title">PUZZLE BOX</div>

        <div class="settings-icon-cell">🥚</div>
        <div class="settings-icon-cell">🐣</div>
        <div class="settings-icon-cell">🐔</div>
      </div>

    <div class="divider"></div>
    <div class="credits-note" aria-label="Licenses and credits">
      <strong>Credits / Licenses</strong><br>
      Font: Denk One from Google Fonts<br>
      License: SIL Open Font License 1.1
    </div>
    <div class="divider"></div>
    <button class="pause-btn" id="closeSettingsBtnHtml">CLOSE</button>
  </div>
</div>

<!-- GAME -->
<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="lidOverlay">
  <div id="escapeLoading">
    <div class="escape-loading-box">
      <div class="escape-spinner"></div>
      <div>BUILDING PUZZLE...</div>
    </div>
  </div>
    <h2 class="lid-title-text">PUZZLE BOX</h2>
    <div id="menuSubtitle" class="menu-subtitle">Choose your favorite from 4 games!</div>

      <button class="game-btn game-choice" data-game="animal"><span class="choice-title">ANIMAL HUNT</span><span class="choice-icons">🐶 🐱 🐰</span></button>
      <button class="game-btn game-choice" data-game="escape"><span class="choice-title">ANIMAL ESCAPE</span><span class="choice-icons">🐼 🦊 🐸</span></button>

    <div id="levelSelect">
      <button class="level-btn" data-size="4">EASY</button>
      <button class="level-btn" data-size="5">NORMAL</button>
      <button class="level-btn" data-size="6">HARD</button>
    </div>    <button class="game-btn menu-back-btn" id="menuBackBtn">BACK TO TOP</button>

<script>
// ============================================================
// THEMES
// ============================================================
const THEMES = {
  wooden: {
    css: { '--main-bg':'#1a1c23','--primary-bg':'#5c4033','--primary-text':'#d4af37' },
    canvas: { bg:"#1a1c23",boardBg:"#2e1c15",boardInner:"#1a1007",tile:"#5c4033",tileHover:"#6d4c41",tileShadow:"#1a1007",tileText:"#f5deb3",empty:"#0a0604",textNormal:"#d4af37",textHighlight:"#ffffff",btnBg:"#5c4033",btnHover:"#6d4c41",btnShadow:"#1a1007",correctTile:"#8a6a00" },
    style:"wooden"
  },
  plastic: {
    css: { '--main-bg':'#1a3636','--primary-bg':'#c99a5b','--primary-text':'#5a3a15' },
    canvas: { bg:"#1a3636",boardBg:"#c99a5b",boardInner:"#8a6632",tile:"#e1c699",tileHover:"#f1c27d",tileShadow:"#b88a44",tileText:"#5a3a15",empty:"#1a1a1a",textNormal:"#eac086",textHighlight:"#ffffff",btnBg:"#e1c699",btnHover:"#f1c27d",btnShadow:"#b88a44",correctTile:"#7aba6a" },
    style:"plastic"
  },
  metallic: {
    css: { '--main-bg':'#111111','--primary-bg':'#737a82','--primary-text':'#ffffff' },
    canvas: { bg:"#111111",boardBg:"#dddddd",boardInner:"#737a82",tile:"#e0e0e0",tileHover:"#ffffff",tileShadow:"#050505",tileText:"#3b0c0c",empty:"#737a82",textNormal:"#ffffff",textHighlight:"#ffffff",btnBg:"#737a82",btnHover:"#888f96",btnShadow:"#050505",correctTile:"#5599aa" },
    style:"metallic"
  },

function applyTheme(name) {
  const t = THEMES[name]; if (!t) return;
  for (const [k,v] of Object.entries(t.css)) document.documentElement.style.setProperty(k,v);
  CFG.colors = {...t.canvas};
  CFG.themeStyle = t.style;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('selected', b.dataset.theme===name));
}

function _loadSound() {
  if (_soundBuf) return;
  try {
    const ac = getAudioCtx();
    const bin = atob(_mp3b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    ac.decodeAudioData(bytes.buffer, buf => { _soundBuf = buf; });
  } catch(e) {}
}

function _playBuf() {
  if (!CFG.soundOn) return;
  try {
    const ac = getAudioCtx();
    if (ac.state === 'suspended') ac.resume();
    if (!_soundBuf) { _loadSound(); return; }
    const src = ac.createBufferSource();
    src.buffer = _soundBuf;
    src.connect(ac.destination);
    src.start(0);
  } catch(e) {}
}

// Load sound on first user interaction
window.addEventListener('pointerdown', _primeAudio, { once: true });
window.addEventListener('keydown', _primeAudio, { once: true });

function _primeAudio() {
  try {
    const ac = getAudioCtx();
    if (ac.state === 'suspended') ac.resume();
  } catch(e) {}
}

function _playTone(freq = 523.25, duration = 0.08, delay = 0, volume = 0.08, type = 'sine') {
  if (!CFG.soundOn) return;
  try {
    const ac = getAudioCtx();
    if (ac.state === 'suspended') ac.resume();
    const start = ac.currentTime + delay;
    const end = start + duration;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, end);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(start);
    osc.stop(end + 0.02);
  } catch(e) {}
}

let menuBoard = [];
let menuEmpty = 15;
let menuAnimTimer = 0;
let menuMoveQueue = [];
let menuAnimating = false;
let menuAnimProgress = 0;
let menuAnimFrom = -1, menuAnimTo = -1;
let particles = [];

function initMenuBoard() {
  menuBoard = [];
  for(let i=0;i<16;i++) menuBoard.push(i<15?i+1:0);
  menuEmpty = 15;
  menuMoveQueue = [];
  // shuffle visually
  let last=-1;
  for(let i=0;i<60;i++){
    let n=menuNeighbors(menuEmpty);
    if(n.length>1&&last!==-1) n=n.filter(x=>x!==last);
    const pick=n[Math.floor(Math.random()*n.length)];
    menuBoard[menuEmpty]=menuBoard[pick]; menuBoard[pick]=0;
    last=menuEmpty; menuEmpty=pick;
  }
  buildMenuMoves();
}

function menuNeighbors(idx){
  const s=4,c=idx%s,r=Math.floor(idx/s),n=[];
  if(c>0)n.push(idx-1);if(c<s-1)n.push(idx+1);
  if(r>0)n.push(idx-s);if(r<s-1)n.push(idx+s);
  return n;
}

function buildMenuMoves(){
  // random walk
  menuMoveQueue=[];
  let e=menuEmpty, last=-1;
  for(let i=0;i<40;i++){
    let n=menuNeighbors(e);
    if(n.length>1&&last!==-1) n=n.filter(x=>x!==last);
    const pick=n[Math.floor(Math.random()*n.length)];
    menuMoveQueue.push(pick);
    last=e; e=pick;
  }
}

function updateMenuBoard(dt){
  if(ST.phase!=='menu') return;
  menuAnimTimer+=dt;
  const speed=0.9;
  if(!menuAnimating){
    if(menuAnimTimer>0.55){
      menuAnimTimer=0;
      if(menuMoveQueue.length===0) buildMenuMoves();
      const target=menuMoveQueue.shift();
      menuAnimFrom=menuEmpty; menuAnimTo=target;
      menuAnimating=true; menuAnimProgress=0;
    }
  } else {
    menuAnimProgress+=dt*speed*4;
    if(menuAnimProgress>=1){
      menuAnimProgress=1; menuAnimating=false;
      menuBoard[menuAnimFrom]=menuBoard[menuAnimTo];
      menuBoard[menuAnimTo]=0; menuEmpty=menuAnimTo;
    }
  }
}

function initParticles(w, h){
  particles=[];
  for(let i=0;i<28;i++){
    particles.push({
      x:Math.random()*w, y:Math.random()*h,
      vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4,
      r:2+Math.random()*4,
      alpha:0.08+Math.random()*0.18,
      pulse:Math.random()*Math.PI*2,
      pulseSpeed:0.5+Math.random()*0.8
    });
  }
}

function updateParticles(dt){
  if(ST.phase!=='menu') return;
  const pc=document.getElementById('menuParticles');
  if(!pc) return;
  const w=pc.width, h=pc.height;
  const cx=pc.getContext('2d');
  cx.clearRect(0,0,w,h);

  // get a color from current theme
  const col = CFG.colors.tileText || '#5a3a15';

  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy;
    p.pulse+=dt*p.pulseSpeed;
    if(p.x<-10)p.x=w+10; if(p.x>w+10)p.x=-10;
    if(p.y<-10)p.y=h+10; if(p.y>h+10)p.y=-10;
    const a=p.alpha*(0.6+0.4*Math.sin(p.pulse));
    cx.beginPath();
    cx.arc(p.x,p.y,p.r,0,Math.PI*2);
    cx.fillStyle=col;
    cx.globalAlpha=a;
    cx.fill();
    cx.globalAlpha=1;
  }
}

function drawMenuBoard(){
  if(ST.phase!=='menu') return;
  const s=4;
  const step=ST.layout.tileSize+CFG.tileGap;
  const animVal = menuAnimating ? menuBoard[menuAnimTo] : -1;

  for(let i=0;i<16;i++){
    const v=menuBoard[i];
    if(v===0) continue;
    if(menuAnimating && i===menuAnimTo) continue; // drawn separately
    drawTile(v,i%s,Math.floor(i/s));
  }

  if(menuAnimating){
    const p=easeOutBack(Math.min(menuAnimProgress,1));
    const fc=menuAnimTo%s, fr=Math.floor(menuAnimTo/s);
    const tc=menuAnimFrom%s, tr=Math.floor(menuAnimFrom/s);
    const cc=fc+(tc-fc)*p, rr2=fr+(tr-fr)*p;
    drawTile(menuBoard[menuAnimTo],cc,rr2,true);
  }
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio||1, DW = 0, DH = 0;

// Fixed logical canvas size — always the same, CSS scales it
const LOGICAL_W = 540;
const LOGICAL_H = 780;

function resize() {
  DW = LOGICAL_W;
  DH = LOGICAL_H;

  // Scale to fit screen maintaining aspect ratio
  const scaleX = window.innerWidth  / LOGICAL_W;
  const scaleY = window.innerHeight / LOGICAL_H;
  const scale  = Math.min(scaleX, scaleY);

  const wrapper = document.getElementById('gameWrapper');
  wrapper.style.width    = LOGICAL_W + 'px';
  wrapper.style.height   = LOGICAL_H + 'px';
  wrapper.style.position = 'absolute';
  wrapper.style.left     = Math.floor((window.innerWidth  - LOGICAL_W * scale) / 2) + 'px';
  wrapper.style.top      = Math.floor((window.innerHeight - LOGICAL_H * scale) / 2) + 'px';
  wrapper.style.transform        = `scale(${scale})`;
  wrapper.style.transformOrigin  = '0 0';

  canvas.style.width  = LOGICAL_W + 'px';
  canvas.style.height = LOGICAL_H + 'px';
  canvas.width  = Math.floor(LOGICAL_W * dpr);
  canvas.height = Math.floor(LOGICAL_H * dpr);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
  updateLayout();
}

function updateLayout() {
  const isLandscape = DW > DH;
  const minDim = Math.min(DW, DH);
  const maxDim = Math.max(DW, DH);

  // Fixed zones for header and footer
  const pad  = 16;
  const hdrH = 56;
  const ftrH = 72;

  // Board max size — never fill whole screen
  const maxBoard   = Math.min(500, DW * 0.85, DH * 0.75);
  const vertSpace  = DH - pad - hdrH - ftrH - pad;
  const horizSpace = DW - pad * 2;
  ST.layout.boardSize = Math.floor(Math.min(horizSpace, vertSpace, maxBoard));
  ST.layout.tileSize  = (ST.layout.boardSize - CFG.tileGap * (CFG.gridSize + 1)) / CFG.gridSize;

  // Total height needed: hdrGap + hdrH + boardGap + board + boardGap + btnH + ftrGap
  const hdrGap = 16;   // top screen to MOVES/TIME
  const hdrH2  = 36;   // MOVES/TIME text height
  const gap1   = 32;   // MOVES/TIME to board
  const gap2   = 16;   // board to SHUFFLE
  const btnH   = 44;   // SHUFFLE button height
  const ftrGap = 16;   // SHUFFLE to bottom

  const totalH = hdrGap + hdrH2 + gap1 + ST.layout.boardSize + gap2 + btnH + ftrGap;
  const startY = Math.floor((DH - totalH) / 2);  // vertically center everything

  ST.layout.boardX  = Math.floor((DW - ST.layout.boardSize) / 2);
  ST.layout.boardY  = startY + hdrGap + hdrH2 + gap1;
  ST.layout.headerY = startY + hdrGap + hdrH2 / 2;

  const boardBottom = ST.layout.boardY + ST.layout.boardSize;
  const bw = Math.min(160, DW * 0.42), bh = btnH;
  // SHUFFLE: 32px below board
  ST.layout.shuffleBtn = {
    x: (DW - bw) / 2,
    y: boardBottom + 32,
    w: bw, h: bh
  };

  // Lid overlay
  const lid = document.getElementById('lidOverlay'), p = 10;
  lid.style.left   = (ST.layout.boardX - p) + 'px';
  lid.style.top    = (ST.layout.boardY - p) + 'px';
  lid.style.width  = (ST.layout.boardSize + p * 2) + 'px';
  lid.style.height = (ST.layout.boardSize + p * 2) + 'px';

  const cc = document.getElementById('confettiCanvas');
  cc.width = DW; cc.height = DH; cc.style.width = DW+'px'; cc.style.height = DH+'px';
  const mp = document.getElementById('menuParticles');
  if(mp){ mp.width = mp.offsetWidth||DW; mp.height = mp.offsetHeight||DH; }
  if(particles.length===0) initParticles(DW, DH);
}

function initSolved() {
  ST.board=[];
  for(let i=0;i<TILE_COUNT-1;i++) ST.board.push(i+1);
  ST.board.push(0);
  ST.emptyIdx=TILE_COUNT-1;
}

function getNeighbors(idx) {
  const s=CFG.gridSize,c=idx%s,r=Math.floor(idx/s),n=[];
  if(c>0) n.push(idx-1); if(c<s-1) n.push(idx+1);
  if(r>0) n.push(idx-s); if(r<s-1) n.push(idx+s);
  return n;
}

function shuffleBoard() {
  initSolved();
  let last=-1;
  for(let i=0;i<CFG.shuffleMoves;i++) {
    let n=getNeighbors(ST.emptyIdx);
    if(n.length>1&&last!==-1) n=n.filter(x=>x!==last);
    const pick=n[Math.floor(Math.random()*n.length)];
    ST.board[ST.emptyIdx]=ST.board[pick]; ST.board[pick]=0;
    last=ST.emptyIdx; ST.emptyIdx=pick;
  }
  ST.moves=0; ST.elapsed=0; ST.animations=[]; ST.drag=null;
}

function applyMove(tileIdx) {
  const nb=getNeighbors(ST.emptyIdx);
  if(!nb.includes(tileIdx)) return;
  const s=CFG.gridSize;
  ST.animations.push({
    val:ST.board[tileIdx],
    startC:tileIdx%s, startR:Math.floor(tileIdx/s),
    targetC:ST.emptyIdx%s, targetR:Math.floor(ST.emptyIdx/s),
    progress:0, snap:true
  });
  ST.board[ST.emptyIdx]=ST.board[tileIdx];
  ST.board[tileIdx]=0; ST.emptyIdx=tileIdx; ST.moves++;
}

function checkWin() {
  for(let i=0;i<TILE_COUNT-1;i++) if(ST.board[i]!==i+1) return false;
  return ST.board[TILE_COUNT-1]===0;
}

function triggerWin() {
  ST.phase='victory';
  playWin(); spawnConfetti(); saveAndShowWin();
}

function updateConfetti() {
  const cc=document.getElementById('confettiCanvas');

  let alive=false;
  for(const p of ST.confetti) {
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.vrot;
    if(p.y>cc.height+20) p.alpha-=0.05;
    if(p.alpha>0) {
      alive=true;
      cx.save(); cx.globalAlpha=Math.max(0,p.alpha);
      cx.translate(p.x,p.y); cx.rotate(p.rot*Math.PI/180);
      cx.fillStyle=p.color; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      cx.restore();
    }
  }
  if(!alive) { ST.confetti=[]; cx.clearRect(0,0,cc.width,cc.height); }
}

let clearResultTimer = null;

function showClearThenResults(showResults) {

    clearResultTimer = null;
  }
  const clearOverlay = document.getElementById('clearOverlay');
  if (clearOverlay) clearOverlay.classList.remove('active');

}

function cancelClearOverlay() {
  clearResultCallback = null;
  if (clearResultTimer) {
    clearTimeout(clearResultTimer);

function saveAndShowWin() {

  const d=new Date();
  scores.push({time:ST.elapsed,moves:ST.moves,date:d.toLocaleDateString(undefined,{month:'short',day:'numeric'})});
  scores.sort((a,b)=>a.time!==b.time?a.time-b.time:a.moves-b.moves);

  localStorage.setItem(key,JSON.stringify(scores));
  document.getElementById('bestResultsTitle').innerText=`BEST ${CFG.gridSize}x${CFG.gridSize}`;
  let html='';
  for(let i=0;i<5;i++) {
    const s=scores[i];
    const me=s&&Math.abs(s.time-ST.elapsed)<0.5&&s.moves===ST.moves;
    html+=`<div class="score-row${me?' highlight':''}">
      <span>${i+1}.</span><span>${s?fmtTime(s.time):'--:--'}</span>
      <span style="opacity:0.75">${s?s.moves+' moves':'--'}</span>
      <span style="opacity:0.6;font-size:12px">${s?s.date:''}</span>
    </div>`;
  }
  document.getElementById('leaderboardList').innerHTML=html;
  document.getElementById('currentResultDisplay').innerText=`${fmtTime(ST.elapsed)} - ${ST.moves} moves`;
  document.getElementById('winOverlay').classList.add('active');

function fmtTime(sec) {
  const s=Math.floor(sec),m=Math.floor(s/60);
  return `${m}:${(s%60)<10?'0':''}${s%60}`;
}

const INP = {x:0,y:0,down:false,justDown:false,justUp:false};

function setPtr(e) {
  let cx,cy;
  if(e.touches&&e.touches.length>0){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  const r=canvas.getBoundingClientRect();
  INP.x=(cx-r.left)/(r.width/DW);
  INP.y=(cy-r.top)/(r.height/DH);
}
function isHtmlButtonEvent(e) {
  return e.target && e.target.closest && e.target.closest('button');
}
window.addEventListener('mousedown',e=>{if(isHtmlButtonEvent(e))return;setPtr(e);INP.down=true;INP.justDown=true;});
window.addEventListener('mousemove',e=>{if(isHtmlButtonEvent(e))return;setPtr(e);});
window.addEventListener('mouseup',e=>{if(isHtmlButtonEvent(e))return;INP.down=false;INP.justUp=true;});
window.addEventListener('touchstart',e=>{if(isHtmlButtonEvent(e))return;e.preventDefault();setPtr(e);INP.down=true;INP.justDown=true;},{passive:false});
window.addEventListener('touchmove',e=>{if(isHtmlButtonEvent(e))return;e.preventDefault();setPtr(e);},{passive:false});
window.addEventListener('touchend',e=>{if(isHtmlButtonEvent(e))return;INP.down=false;INP.justUp=true;});

window.addEventListener('keydown',e=>{
  if(ST.phase!=='playing') return;
  if (ST.currentGame === 'merge') {
    if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') moveMerge('left');
    else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') moveMerge('right');
    else if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') moveMerge('up');
    else if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') moveMerge('down');
    else if (e.key.toLowerCase() === 'r' || e.key === ' ') initMergeBoard();
    return;
  }
  if (ST.currentGame === 'escape') {
    const k = e.key.toLowerCase();
    if (e.key === 'ArrowLeft' || k === 'a') moveEscapeBlock(ST.escapeSelected, 'left');
    else if (e.key === 'ArrowRight' || k === 'd') moveEscapeBlock(ST.escapeSelected, 'right');
    else if (e.key === 'ArrowUp' || k === 'w') moveEscapeBlock(ST.escapeSelected, 'up');
    else if (e.key === 'ArrowDown' || k === 's') moveEscapeBlock(ST.escapeSelected, 'down');
    else if (k === 'r' || e.key === ' ') requestEscapePuzzleRebuild();
    return;
  }
  if (ST.currentGame === 'number') {
    const k = e.key.toLowerCase();
    if (k === 'r' || e.key === ' ') initNumberPuzzle();
    return;
  }
  const s=CFG.gridSize, ei=ST.emptyIdx;
  let t=-1;
  if(e.key==='ArrowLeft') { if(ei%s<s-1) t=ei+1; }
  else if(e.key==='ArrowRight') { if(ei%s>0) t=ei-1; }
  else if(e.key==='ArrowUp') { if(Math.floor(ei/s)<s-1) t=ei+s; }
  else if(e.key==='ArrowDown') { if(Math.floor(ei/s)>0) t=ei-s; }
  if(t>=0&&t<TILE_COUNT) {
    applyMove(t);
    if(checkWin()) triggerWin();
  }
});

// UPDATE
// ============================================================
function updateLogic(dt) {
  if(ST.phase==='playing') ST.elapsed+=dt;

  for(let i=ST.animations.length-1;i>=0;i--) {
    const a=ST.animations[i];
    a.progress+=dt*CFG.animSpeed;
    if(a.progress>=1) { if(a.snap) playMove(); ST.animations.splice(i,1); }
  }

  updateConfetti();
  updateMenuBoard(dt);
  updateParticles(dt);

  const b=ST.layout.shuffleBtn;
  ST.hoveredBtn=false;
  if(ST.phase==='playing') {
    if(INP.x>=b.x&&INP.x<=b.x+b.w&&INP.y>=b.y&&INP.y<=b.y+b.h) {
      ST.hoveredBtn=true;
      if(INP.justDown) { ST.pressedBtn=true; shuffleBoard(); }
    }
  }
  if(!INP.down) ST.pressedBtn=false;

  ST.hoveredTile=-1;
  if(ST.phase==='playing') {
    const s=CFG.gridSize, step=ST.layout.tileSize+CFG.tileGap;
    const px=INP.x-ST.layout.boardX, py=INP.y-ST.layout.boardY;
    if(px>=0&&px<=ST.layout.boardSize&&py>=0&&py<=ST.layout.boardSize&&!ST.drag) {
      const c=Math.floor((px-CFG.tileGap)/step);
      const r=Math.floor((py-CFG.tileGap)/step);
      if(c>=0&&c<s&&r>=0&&r<s) {
        const idx=r*s+c;
        ST.hoveredTile=idx;
        if(INP.justDown&&ST.board[idx]!==0) {
          const c2=ST.emptyIdx%s, r2=Math.floor(ST.emptyIdx/s);
          if(r===r2||c===c2) {
            const tiles=[]; let dc=0,dr=0;
            if(r===r2){dc=c<c2?1:-1;for(let i=c;i!==c2;i+=dc)tiles.push(r*s+i);}
            else{dr=r<r2?1:-1;for(let i=r;i!==r2;i+=dr)tiles.push(i*s+c);}
            ST.drag={tiles,startX:INP.x,startY:INP.y,offsetX:0,offsetY:0,dc,dr};
          }
        }
      }
    }

    if(ST.drag) {
      const {dc,dr}=ST.drag;
      if(INP.down) {
        const dx=INP.x-ST.drag.startX, dy=INP.y-ST.drag.startY;
        if(dc!==0) ST.drag.offsetX=Math.max(Math.min(dx,Math.max(0,dc*step)),Math.min(0,dc*step));
        if(dr!==0) ST.drag.offsetY=Math.max(Math.min(dy,Math.max(0,dr*step)),Math.min(0,dr*step));
      }
      if(INP.justUp) {
        const dist=Math.abs(dc!==0?ST.drag.offsetX:ST.drag.offsetY);
        if(dist>step/2) {
          for(const idx of ST.drag.tiles) {
            ST.animations.push({
              val:ST.board[idx],
              startC:(idx%s)+(dc!==0?ST.drag.offsetX/step:0),
              startR:Math.floor(idx/s)+(dr!==0?ST.drag.offsetY/step:0),
              targetC:(idx%s)+dc, targetR:Math.floor(idx/s)+dr,
              progress:0, snap:idx===ST.drag.tiles[ST.drag.tiles.length-1]
            });
          }
          for(let i=ST.drag.tiles.length-1;i>=0;i--){
            const ci=ST.drag.tiles[i],ni=ci+(dr*s)+dc;
            ST.board[ni]=ST.board[ci];
          }
          ST.board[ST.drag.tiles[0]]=0; ST.emptyIdx=ST.drag.tiles[0]; ST.moves++;
          if(checkWin()) setTimeout(triggerWin,300);
        } else {
          for(const idx of ST.drag.tiles) {
            ST.animations.push({
              val:ST.board[idx],
              startC:(idx%s)+(dc!==0?ST.drag.offsetX/step:0),
              startR:Math.floor(idx/s)+(dr!==0?ST.drag.offsetY/step:0),
              targetC:idx%s, targetR:Math.floor(idx/s),
              progress:0, snap:false
            });
          }
        }
        ST.drag=null;
      }
    }
  }

  INP.justDown=false; INP.justUp=false;
}

function easeOutBack(x) {
  const c1=1.70158,c3=c1+1;
  return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);
}

function rr(x,y,w,h,r,fill) {
  ctx.fillStyle=fill;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r); ctx.fill();
}

// ============================================================
// ANIMAL HUNT OVERRIDES
// ============================================================
function shuffledCopy(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateAnimalColumns(size) {
  const cols = Array(size).fill(-1);
  const used = Array(size).fill(false);

  function backtrack(row) {
    if (row >= size) return true;
    const order = shuffledCopy([...Array(size).keys()]);
    for (const c of order) {
      if (used[c]) continue;
      if (row > 0 && Math.abs(c - cols[row - 1]) <= 1) continue;
      cols[row] = c;
      used[c] = true;
      if (backtrack(row + 1)) return true;
      used[c] = false;
      cols[row] = -1;
    }
    return false;
  }

  for (let tries = 0; tries < 80; tries++) {
    cols.fill(-1);
    used.fill(false);
    if (backtrack(0)) return cols.slice();
  }
  return [1, 3, 0, 2, 4, 5].slice(0, size);
}

function buildAnimalRegions(size, animals) {
  const total = size * size;
  const regions = Array(total).fill(-1);
  const regionCells = Array.from({ length: size }, () => []);
  const blobTarget = CFG.levelColorBlobs[size] || 1;

  for (let r = 0; r < size; r++) {
    const idx = animals.indexOf(true, r * size);
    regions[idx] = r;
    regionCells[r].push(idx);
  }

  function cellNeighbors(idx) {
    const c = idx % size;
    const r = Math.floor(idx / size);
    const n = [];
    if (c > 0) n.push(idx - 1);
    if (c < size - 1) n.push(idx + 1);
    if (r > 0) n.push(idx - size);
    if (r < size - 1) n.push(idx + size);
    return n;
  }

  function frontierFor(regionId) {
    const out = [];
    for (const idx of regionCells[regionId]) {
      for (const n of cellNeighbors(idx)) {
        if (regions[n] === -1 && !out.includes(n)) out.push(n);
      }
    }
    return out;
  }

  while (regions.some(v => v === -1)) {
    let candidates = [...Array(size).keys()].filter(id => frontierFor(id).length > 0);
    if (!candidates.length) break;

    const favored = candidates.filter(id => id < blobTarget);
    if (favored.length && Math.random() < 0.65) candidates = favored;

    const regionId = candidates[Math.floor(Math.random() * candidates.length)];
    const frontier = frontierFor(regionId);
    const pick = frontier[Math.floor(Math.random() * frontier.length)];
    regions[pick] = regionId;
    regionCells[regionId].push(pick);
  }

  return regions;
}

function validateAnimalPuzzle(size, animals, regions) {
  for (let r = 0; r < size; r++) {
    let count = 0;
    for (let c = 0; c < size; c++) if (animals[r * size + c]) count++;
    if (count !== 1) return false;
  }
  for (let c = 0; c < size; c++) {
    let count = 0;
    for (let r = 0; r < size; r++) if (animals[r * size + c]) count++;
    if (count !== 1) return false;
  }
  for (let i = 0; i < animals.length; i++) {
    if (!animals[i]) continue;
    const c = i % size;
    const r = Math.floor(i / size);
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const rr2 = r + dr;
        const cc = c + dc;
        if (rr2 < 0 || rr2 >= size || cc < 0 || cc >= size) continue;
        if (animals[rr2 * size + cc]) return false;
      }
    }
  }
  for (let region = 0; region < size; region++) {
    let count = 0;
    for (let i = 0; i < regions.length; i++) {
      if (regions[i] === region && animals[i]) count++;
    }
    if (count !== 1) return false;
  }
  return true;
}

function createAnimalPuzzle() {
  const size = CFG.gridSize;
  TILE_COUNT = size * size;

  for (let tries = 0; tries < 120; tries++) {
    const cols = generateAnimalColumns(size);
    const animals = Array(TILE_COUNT).fill(false);
    for (let r = 0; r < size; r++) animals[r * size + cols[r]] = true;
    const regions = buildAnimalRegions(size, animals);
    if (!validateAnimalPuzzle(size, animals, regions)) continue;

    ST.board = [];
    ST.emptyIdx = -1;
    ST.solution = animals;
    ST.regions = regions;
    ST.marks = Array(TILE_COUNT).fill(0);
    ST.shakes = Array(TILE_COUNT).fill(0);
    ST.found = 0;
    ST.mistakes = 0;
    ST.animalCount = size;
    ST.press = null;
    ST.hoveredTile = -1;
    ST.moves = 0;
    ST.elapsed = 0;
    ST.animations = [];
    ST.drag = null;
    return;
  }
}

function checkWin() {
  return ST.found >= ST.animalCount;
}

function tileAtPointer() {
  const s = CFG.gridSize;
  const step = ST.layout.tileSize + CFG.tileGap;
  const px = INP.x - ST.layout.boardX;
  const py = INP.y - ST.layout.boardY;
  if (px < 0 || py < 0 || px > ST.layout.boardSize || py > ST.layout.boardSize) return -1;
  const c = Math.floor((px - CFG.tileGap) / step);
  const r = Math.floor((py - CFG.tileGap) / step);
  if (c < 0 || c >= s || r < 0 || r >= s) return -1;
  return r * s + c;
}

function toggleAnimalMark(idx) {
  if (idx < 0 || ST.marks[idx] === 2) return;
  ST.marks[idx] = ST.marks[idx] === 1 ? 0 : 1;
  ST.moves++;
  playMove();
}

function revealAnimalCell(idx) {
  if (idx < 0 || ST.marks[idx] === 2) return;
  ST.moves++;
  if (ST.solution[idx]) {
    ST.marks[idx] = 2;
    ST.found++;
    playMove();
    if (checkWin()) setTimeout(triggerWin, 250);
  } else {
    ST.mistakes++;
    ST.shakes[idx] = CFG.shakeDuration;
    playMove();
  }
}

function triggerWin() {
  if (ST.phase === 'victory') return;
  ST.phase = 'victory';
  playWin();
  spawnConfetti();
  showClearThenResults(saveAndShowWin);
}

function saveAndShowWin() {
  const key = `animalhunt_top5_${CFG.gridSize}`;
  let scores = JSON.parse(localStorage.getItem(key) || '[]');
  const d = new Date();
  scores.push({ time: ST.elapsed, moves: ST.moves, mistakes: ST.mistakes, date: d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) });
  scores.sort((a, b) => a.time !== b.time ? a.time - b.time : a.mistakes - b.mistakes);
  scores = scores.slice(0, 5);
  localStorage.setItem(key, JSON.stringify(scores));

  document.querySelector('#winOverlay h2').innerText = 'ALL FOUND!';
  document.getElementById('bestResultsTitle').innerText = `BEST ${CFG.gridSize}x${CFG.gridSize}`;
  let html = '';
  for (let i = 0; i < 5; i++) {
    const s = scores[i];
    const me = s && Math.abs(s.time - ST.elapsed) < 0.5 && s.moves === ST.moves && s.mistakes === ST.mistakes;
    html += `<div class="score-row${me ? ' highlight' : ''}">
      <span>${i + 1}.</span><span>${s ? fmtTime(s.time) : '--:--'}</span>
      <span style="opacity:0.75">${s ? s.mistakes + ' miss' : '--'}</span>
      <span style="opacity:0.6;font-size:12px">${s ? s.date : ''}</span>
    </div>`;
  }
  document.getElementById('leaderboardList').innerHTML = html;
  document.getElementById('currentResultDisplay').innerText = `${fmtTime(ST.elapsed)} - ${ST.mistakes} misses`;
  document.getElementById('winOverlay').classList.add('active');
}

function updateLogic(dt) {
  if (ST.currentGame === 'merge') {
    updateMergeLogic(dt);
    return;
  }
  if (ST.currentGame === 'number') {
    updateNumberLogic(dt);
    return;
  }
  if (ST.currentGame === 'escape') {
    updateEscapeLogic(dt);
    return;
  }
  if (ST.phase === 'playing') ST.elapsed += dt;

  updateConfetti();
  updateMenuBoard(dt);
  updateParticles(dt);

  if (ST.shakes) {
    for (let i = 0; i < ST.shakes.length; i++) ST.shakes[i] = Math.max(0, ST.shakes[i] - dt);
  }

  const b = ST.layout.shuffleBtn;
  ST.hoveredBtn = false;
  ST.hoveredTile = -1;

  if (ST.phase === 'playing') {
    const idx = tileAtPointer();
    ST.hoveredTile = idx;

    if (INP.x >= b.x && INP.x <= b.x + b.w && INP.y >= b.y && INP.y <= b.y + b.h) {
      ST.hoveredBtn = true;
      if (INP.justDown) {
        ST.pressedBtn = true;
        shuffleBoard();
      }
    }

    if (!ST.hoveredBtn) {
      if (INP.justDown && idx >= 0) {
        ST.press = { idx, time: 0, longDone: false };
      }
      if (ST.press && INP.down) {
        ST.press.time += dt;
        if (idx !== ST.press.idx) ST.press = null;
        else if (!ST.press.longDone && ST.press.time >= CFG.longPressTime) {
          revealAnimalCell(ST.press.idx);
          ST.press.longDone = true;
        }
      }
      if (INP.justUp && ST.press) {
        if (!ST.press.longDone && idx === ST.press.idx) toggleAnimalMark(ST.press.idx);
        ST.press = null;
      }
    }
  }

  if (!INP.down) ST.pressedBtn = false;
  INP.justDown = false;
  INP.justUp = false;
}

function drawAnimalGlyph(x, y, size, emoji) {
  ctx.save();
  ctx.font = `${size * 0.52}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.25)';
  ctx.shadowBlur = 8;
  ctx.fillText(emoji, x + size / 2, y + size / 2 + size * 0.02);
  ctx.restore();
}

function drawAnimalCell(idx, c, r2) {
  const step = ST.layout.tileSize + CFG.tileGap;
  const size = ST.layout.tileSize;
  const shake = ST.shakes && ST.shakes[idx] > 0 ? Math.sin(ST.elapsed * 95) * 7 * (ST.shakes[idx] / CFG.shakeDuration) : 0;
  const x = ST.layout.boardX + CFG.tileGap + c * step + shake;
  const y = ST.layout.boardY + CFG.tileGap + r2 * step;
  const region = ST.regions[idx] || 0;
  const base = CFG.regionColors[region % CFG.regionColors.length];
  const hov = idx === ST.hoveredTile && ST.phase === 'playing';

  rr(x + 2, y + 7, size, size, CFG.cornerRadius, 'rgba(0,0,0,0.24)');
  rr(x, y, size, size, CFG.cornerRadius, hov ? '#fff4cc' : base);

  const shine = ctx.createLinearGradient(x, y, x, y + size);
  shine.addColorStop(0, 'rgba(255,255,255,0.35)');
  shine.addColorStop(1, 'rgba(255,255,255,0.03)');
  rr(x, y, size, size, CFG.cornerRadius, shine);

  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + CFG.cornerRadius, y + 2);
  ctx.lineTo(x + size - CFG.cornerRadius, y + 2);
  ctx.stroke();

  if (ST.marks[idx] === 1) {
    ctx.save();
    ctx.strokeStyle = '#b00020';
    ctx.lineWidth = Math.max(5, size * 0.08);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + size * 0.25, y + size * 0.25);
    ctx.lineTo(x + size * 0.75, y + size * 0.75);
    ctx.moveTo(x + size * 0.75, y + size * 0.25);
    ctx.lineTo(x + size * 0.25, y + size * 0.75);
    ctx.stroke();
    ctx.restore();
  } else if (ST.marks[idx] === 2) {
    const emoji = CFG.animalEmojis[region % CFG.animalEmojis.length] || CFG.animalEmoji;
    drawAnimalGlyph(x, y, size, emoji);
  } else if (CFG.hintOn && ST.solution && ST.solution[idx]) {
    ctx.save();
    ctx.globalAlpha = 0.28;

// EGG MERGE PUZZLE
// ============================================================
function mergeEmptyCells() {
  const out = [];
  for (let i = 0; i < ST.mergeBoard.length; i++) {
    if (!ST.mergeBoard[i]) out.push(i);
  }
  return out;
}

function addMergeTile() {
  const empty = mergeEmptyCells();
  if (!empty.length) return;
  const idx = empty[Math.floor(Math.random() * empty.length)];
  ST.mergeBoard[idx] = Math.random() < 0.12 ? 2 : 1;
}

function initMergeBoard() {
  CFG.gridSize = CFG.mergeGridSize;
  TILE_COUNT = CFG.gridSize * CFG.gridSize;
  ST.mergeBoard = Array(TILE_COUNT).fill(0);
  ST.mergeGameOver = false;
  ST.mergeSwipe = null;
  ST.mergeGoals = (CFG.mergeGoalLevels || [CFG.mergeTargetLevel]).slice();
  ST.mergeGoalsDone = ST.mergeGoals.map(() => false);
  ST.moves = 0;
  ST.elapsed = 0;
  ST.hoveredBtn = false;
  ST.pressedBtn = false;
  for (let i = 0; i < CFG.mergeStartTiles; i++) addMergeTile();
}

function mergeTargetUnits(board = ST.mergeBoard) {
  const targetLevel = CFG.mergeTargetLevel || 7;
  return board.reduce((sum, v) => {
    if (v < targetLevel) return sum;
    return sum + Math.pow(2, v - targetLevel);
  }, 0);
}

function updateMergeGoals() {
  if (!ST.mergeGoals || !ST.mergeGoals.length) {
    ST.mergeGoals = [CFG.mergeTargetLevel];
  }
  const targetCount = CFG.mergeTargetCount || 1;
  const made = mergeTargetUnits();
  ST.mergeGoalsDone = [made >= targetCount];
  return ST.mergeGoalsDone.every(Boolean);
}

function mergeLineLeft(line) {
  const vals = line.filter(v => v > 0);
  const out = [];
  for (let i = 0; i < vals.length; i++) {
    if (vals[i] === vals[i + 1]) {
      out.push(vals[i] + 1);
      i++;
    } else {
      out.push(vals[i]);
    }
  }
  while (out.length < CFG.gridSize) out.push(0);
  return out;
}

function moveMerge(dir) {
  if (ST.phase !== 'playing' || ST.mergeGameOver) return;
  const s = CFG.gridSize;
  const before = ST.mergeBoard.join(',');
  const next = Array(TILE_COUNT).fill(0);

  for (let line = 0; line < s; line++) {
    let cells = [];
    for (let i = 0; i < s; i++) {
      const idx = (dir === 'left' || dir === 'right') ? line * s + i : i * s + line;
      cells.push(ST.mergeBoard[idx]);
    }
    if (dir === 'right' || dir === 'down') cells.reverse();
    let merged = mergeLineLeft(cells);
    if (dir === 'right' || dir === 'down') merged.reverse();
    for (let i = 0; i < s; i++) {
      const idx = (dir === 'left' || dir === 'right') ? line * s + i : i * s + line;
      next[idx] = merged[i];
    }
  }

  if (next.join(',') === before) return;
  ST.mergeBoard = next;
  ST.moves++;
  playMove();

  if (updateMergeGoals()) {
    setTimeout(triggerMergeWin, 180);
    return;
  }

  addMergeTile();
  if (updateMergeGoals()) {
    setTimeout(triggerMergeWin, 180);
  } else if (!hasMergeMove()) {
    triggerMergeGameOver();
  }
}

function hasMergeMove() {
  if (mergeEmptyCells().length) return true;
  const s = CFG.gridSize;
  for (let i = 0; i < TILE_COUNT; i++) {
    const c = i % s;
    const r = Math.floor(i / s);
    if (c < s - 1 && ST.mergeBoard[i] === ST.mergeBoard[i + 1]) return true;
    if (r < s - 1 && ST.mergeBoard[i] === ST.mergeBoard[i + s]) return true;
  }
  return false;
}

function triggerMergeGameOver() {
  if (ST.phase === 'gameover' || ST.phase === 'victory') return;

// ============================================================
// NUMBER GROUPS PUZZLE
// ============================================================
function numberNeighbors(idx, size) {
  const c = idx % size;
  const r = Math.floor(idx / size);
  const n = [];
  if (c > 0) n.push(idx - 1);
  if (c < size - 1) n.push(idx + 1);
  if (r > 0) n.push(idx - size);
  if (r < size - 1) n.push(idx + size);
  return n;
}

function initNumberPuzzle() {
  CFG.gridSize = CFG.numberGridSize;
  TILE_COUNT = CFG.gridSize * CFG.gridSize;
  const size = CFG.gridSize;
  const total = TILE_COUNT;
  const count = Math.min(CFG.numberGroupCount, total);
  const groups = Array.from({ length: count }, (_, id) => ({ id, cells: [], clue: -1, size: 0 }));
  const sol = Array(total).fill(-1);
  const seeds = shuffledCopy([...Array(total).keys()]).slice(0, count);

  for (let id = 0; id < count; id++) {
    sol[seeds[id]] = id;
    groups[id].cells.push(seeds[id]);
  }

  while (sol.some(v => v < 0)) {
    const options = [];
    for (let id = 0; id < count; id++) {
      for (const cell of groups[id].cells) {
        for (const n of numberNeighbors(cell, size)) {
          if (sol[n] < 0) options.push({ id, cell: n });
        }
      }
    }
    if (!options.length) break;
    const pick = options[Math.floor(Math.random() * options.length)];
    sol[pick.cell] = pick.id;
    groups[pick.id].cells.push(pick.cell);
  }

  for (let i = 0; i < total; i++) {
    if (sol[i] < 0) {
      const n = numberNeighbors(i, size).find(x => sol[x] >= 0);
      sol[i] = n >= 0 ? sol[n] : 0;
      groups[sol[i]].cells.push(i);
    }
  }

  for (const g of groups) {
    g.size = g.cells.length;
    g.clue = g.cells[Math.floor(Math.random() * g.cells.length)];
  }

  const marks = Array(total).fill(-1);
  for (const g of groups) marks[g.clue] = g.id;

  ST.numberGroups = groups;
  ST.numberSolution = sol;
  ST.numberMarks = marks;
  ST.numberActive = 0;
  ST.numberDrag = null;
  ST.moves = 0;
  ST.elapsed = 0;
  ST.hoveredBtn = false;
  ST.pressedBtn = false;
}

function numberGroupAtClue(idx) {
  return ST.numberGroups.find(g => g.clue === idx);
}

function handleNumberCell(idx) {
  if (idx < 0) return;
  const clue = numberGroupAtClue(idx);
  if (clue) {
    ST.numberActive = clue.id;
    playMove();
    return;
  }
  ST.numberMarks[idx] = ST.numberMarks[idx] === ST.numberActive ? -1 : ST.numberActive;
  ST.moves++;
  playMove();
  if (checkNumberWin()) setTimeout(triggerNumberWin, 180);
}
function paintNumberStrokeCell(idx) {
  if (idx < 0) return false;
  const clue = numberGroupAtClue(idx);
  if (clue) return clue.id === ST.numberActive;
  if (ST.numberMarks[idx] === ST.numberActive) return true;
  ST.numberMarks[idx] = ST.numberActive;
  ST.moves++;
  playMove();
  if (checkNumberWin()) setTimeout(triggerNumberWin, 180);
  return true;
}

function beginNumberStroke(idx) {
  if (idx < 0) return;
  const clue = numberGroupAtClue(idx);
  if (clue) ST.numberActive = clue.id;
  ST.numberDrag = { start: idx, last: idx, moved: false };
}

function updateNumberStroke(idx) {
  if (!ST.numberDrag || idx < 0 || idx === ST.numberDrag.last) return;
  if (!numberNeighbors(ST.numberDrag.last, CFG.gridSize).includes(idx)) return;

  if (!ST.numberDrag.moved && !numberGroupAtClue(ST.numberDrag.start)) {
    paintNumberStrokeCell(ST.numberDrag.start);
  }
  if (paintNumberStrokeCell(idx)) {
    ST.numberDrag.last = idx;
    ST.numberDrag.moved = true;
  }
}

function finishNumberStroke() {
  if (!ST.numberDrag) return;
  if (!ST.numberDrag.moved && ST.numberDrag.start >= 0) {
    handleNumberCell(ST.numberDrag.start);
  }
  ST.numberDrag = null;
}

function checkNumberWin() {
  if (!ST.numberGroups.length || !ST.numberMarks.length) return false;
  const size = CFG.gridSize;

  for (const g of ST.numberGroups) {
    const cells = [];
    for (let i = 0; i < ST.numberMarks.length; i++) {
      if (ST.numberMarks[i] === g.id) cells.push(i);
    }
    if (cells.length !== g.size || !cells.includes(g.clue)) return false;

    const seen = new Set([g.clue]);
    const stack = [g.clue];
    while (stack.length) {
      const cur = stack.pop();
      for (const n of numberNeighbors(cur, size)) {
        if (ST.numberMarks[n] === g.id && !seen.has(n)) {
          seen.add(n);
          stack.push(n);
        }
      }
    }
    if (seen.size !== cells.length) return false;
  }

  for (let i = 0; i < ST.numberMarks.length; i++) {
    if (ST.numberMarks[i] < 0) return false;
  }
  return true;
}

function updateNumberLogic(dt) {

    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.fillStyle = CFG.colors.textNormal;
    ctx.fillText(`ACTIVE ${active ? active.size : '-'}`, DW * 0.22, hy);
    ctx.fillText(`MOVES ${ST.moves || 0}`, DW * 0.52, hy);
    ctx.fillText(`TIME ${fmtTime(ST.elapsed)}`, DW * 0.80, hy);
  }

  const pad = 12;
  rr(boardX - pad + 4, boardY - pad + 12, boardSize + pad * 2, boardSize + pad * 2, CFG.cornerRadius * 2, CFG.colors.tileShadow);
  rr(boardX - pad, boardY - pad, boardSize + pad * 2, boardSize + pad * 2, CFG.cornerRadius * 2, CFG.colors.boardBg);
  rr(boardX, boardY, boardSize, boardSize, CFG.cornerRadius * 1.5, '#eef8ff');

  const step = ST.layout.tileSize + CFG.tileGap;
  for (let i = 0; i < TILE_COUNT; i++) {
    const c = i % CFG.gridSize;
    const r2 = Math.floor(i / CFG.gridSize);
    const x = boardX + CFG.tileGap + c * step;
    const y = boardY + CFG.tileGap + r2 * step;
    const assigned = ST.numberMarks[i];
    const clue = numberGroupAtClue(i);
    const hov = i === ST.hoveredTile && ST.phase === 'playing';
    const col = assigned >= 0 ? CFG.numberColors[assigned % CFG.numberColors.length] : '#ffffff';
    rr(x + 2, y + 7, ST.layout.tileSize, ST.layout.tileSize, CFG.cornerRadius, 'rgba(0,0,0,0.18)');
    rr(x, y, ST.layout.tileSize, ST.layout.tileSize, CFG.cornerRadius, hov ? '#fff4cc' : col);

    if (clue) {
      ctx.save();
      ctx.fillStyle = clue.id === ST.numberActive ? '#23395d' : '#355070';
      ctx.beginPath();
      ctx.arc(x + ST.layout.tileSize / 2, y + ST.layout.tileSize / 2, ST.layout.tileSize * 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${ST.layout.tileSize * 0.34}px 'Denk One',sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(clue.size, x + ST.layout.tileSize / 2, y + ST.layout.tileSize / 2 + 1);
      ctx.restore();
    }
  }

  if (ST.phase === 'playing') {
    const b = ST.layout.shuffleBtn;
    const yo = ST.pressedBtn ? 4 : 0;
    if (!ST.pressedBtn) rr(b.x, b.y + 4, b.w, b.h, CFG.cornerRadius, CFG.colors.btnShadow);
    rr(b.x, b.y + yo, b.w, b.h, CFG.cornerRadius, ST.hoveredBtn ? CFG.colors.btnHover : CFG.colors.btnBg);
    ctx.fillStyle = '#ffffff';
    ctx.font = `${Math.max(12, Math.min(18, DW * 0.036))}px 'Denk One',sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = CFG.themeStyle === 'minimal' ? CFG.colors.tileText : ctx.fillStyle;
    ctx.fillText('NEW PUZZLE', b.x + b.w / 2, b.y + b.h / 2 + yo + 1);

    ctx.fillStyle = CFG.colors.textNormal;
    ctx.font = `${Math.max(12, Math.min(16, DW * 0.032))}px sans-serif`;
    ctx.fillText('Click a number, then drag a connected one-stroke path', DW / 2, b.y + b.h + 28);
  }
}

function escapeShapeCells(block) {
  if (block.cells && block.cells.length) return block.cells;
  const cells = [];
  for (let y = 0; y < block.h; y++) {
    for (let x = 0; x < block.w; x++) cells.push({ x, y });
  }
  return cells;
}

function escapeBlocksOverlap(a, ax, ay, b, bx, by) {
  const ac = escapeShapeCells(a);
  const bc = escapeShapeCells(b);
  for (const ca of ac) {
    for (const cb of bc) {
      if (ax + ca.x === bx + cb.x && ay + ca.y === by + cb.y) return true;
    }
  }
  return false;
}

function escapeOccupiedCellCount(blocks, x, y, w, h, ignoreId = -1) {
  let count = 0;
  for (let yy = y; yy < y + h; yy++) {
    for (let xx = x; xx < x + w; xx++) {
      if (escapeLayoutOccupied(blocks, ignoreId, xx, yy, 1, 1)) count++;
    }
  }
  return count;
}
function cloneEscapeBlocks(blocks) {
  return blocks.map(b => ({ ...b, cells: b.cells ? b.cells.map(c => ({ ...c })) : undefined }));
}
function escapeLayoutSignature(blocks) {
  return blocks
    .slice()
    .sort((a, b) => a.id - b.id)
    .map(b => `${b.id}:${b.x},${b.y},${b.w},${b.h},${b.kind || ''}`)
    .join('|');
}

function escapeLayoutDifference(signature, previousSignature) {
  if (!previousSignature) return 999;
  const a = signature.split('|');
  const b = previousSignature.split('|');
  let diff = Math.abs(a.length - b.length);
  const len = Math.min(a.length, b.length);
  for (let i = 0; i < len; i++) {
    if (a[i] !== b[i]) diff++;
  }
  return diff;
}

function escapeLayoutOccupied(blocks, ignoreId, x, y, w, h, cells = null) {
  const moving = { x, y, w, h, cells };
  for (const b of blocks) {
    if (b.id === ignoreId) continue;
    if (escapeBlocksOverlap(moving, x, y, b, b.x, b.y)) return true;
  }
  return false;
}

function canMoveEscapeLayout(blocks, id, dir) {
  const b = blocks.find(x => x.id === id);
  if (!b) return false;
  let dx = 0, dy = 0;
  if (dir === 'left') dx = -1;
  if (dir === 'right') dx = 1;
  if (dir === 'up') dy = -1;
  if (dir === 'down') dy = 1;

  const nx = b.x + dx;
  const ny = b.y + dy;
  if (nx < 0 || nx + b.w > CFG.escapeCols || ny < 0 || ny + b.h > CFG.escapeRows) return false;
  return !escapeLayoutOccupied(blocks, b.id, nx, ny, b.w, b.h, b.cells);
}

function applyEscapeLayoutMove(blocks, id, dir) {
  if (!canMoveEscapeLayout(blocks, id, dir)) return false;
  const b = blocks.find(x => x.id === id);
  if (dir === 'left') b.x--;
  if (dir === 'right') b.x++;
  if (dir === 'up') b.y--;
  if (dir === 'down') b.y++;
  return true;
}

function escapeCandidateIsInteresting(blocks) {
  const animal = blocks.find(b => b.animal);
  if (!animal) return false;
  const exitX = Math.floor((CFG.escapeCols - CFG.escapeExitWidth) / 2);
  if (animal.x === exitX && animal.y + animal.h >= CFG.escapeRows) return false;

  let blockersBelow = 0;
  for (let y = animal.y + animal.h; y < CFG.escapeRows; y++) {
    for (let x = exitX; x < exitX + CFG.escapeExitWidth; x++) {
      if (escapeLayoutOccupied(blocks, animal.id, x, y, 1, 1)) blockersBelow++;
    }
  }

  const legalMoves = [];
  for (const b of blocks) {
    for (const dir of ['left', 'right', 'up', 'down']) {
      if (canMoveEscapeLayout(blocks, b.id, dir)) legalMoves.push(`${b.id}:${dir}`);
    }
  }
  return animal.y === 0 && legalMoves.length >= 2 && blockersBelow >= 1;
}

function buildGeneratedEscapePuzzle() {
  const escapeAnimals = [
    { emoji: '🐼', color: '#ffafcc' },
    { emoji: '🦊', color: '#f4a261' },
    { emoji: '🐰', color: '#f7cad0' },
    { emoji: '🐸', color: '#90be6d' },
    { emoji: '🐱', color: '#ffd166' },
    { emoji: '🐶', color: '#bde0fe' },
    { emoji: '🐨', color: '#cdb4db' },
    { emoji: '🐯', color: '#ffb703' }
  ];
  const obstaclePool = [
    { w: 1, h: 2, emoji: '🪵', color: '#b08968' },
    { w: 1, h: 2, emoji: '🌳', color: '#90be6d' },
    { w: 2, h: 1, emoji: '🧱', color: '#e76f51' },
    { w: 2, h: 1, emoji: '🌿', color: '#52b788' },
    { w: 1, h: 3, emoji: '🌲', color: '#588157' },
    { w: 3, h: 1, emoji: '🧱', color: '#c65d35' },
    { w: 2, h: 2, emoji: '🪨', color: '#8d99ae' },
    { w: 1, h: 4, emoji: '🌳', color: '#40916c' },
    { w: 1, h: 1, emoji: '🪨', color: '#adb5bd' },
    { w: 1, h: 1, emoji: '🍄', color: '#f28482' },
    { w: 1, h: 1, emoji: '🪵', color: '#b08968' },
    { w: 1, h: 1, emoji: '🌳', color: '#90be6d' }
  ];
  const dirs = ['left', 'right', 'up', 'down'];
  const exitX = Math.floor((CFG.escapeCols - CFG.escapeExitWidth) / 2);

  for (let attempt = 0; attempt < 90; attempt++) {
    let animalIndex = Math.floor(Math.random() * escapeAnimals.length);
    if (escapeAnimals.length > 1 && ST.escapeLastAnimal === animalIndex) {
      animalIndex = (animalIndex + 1 + Math.floor(Math.random() * (escapeAnimals.length - 1))) % escapeAnimals.length;
    }
    const escapeAnimal = escapeAnimals[animalIndex];
    const animalH = Math.random() < 0.58 ? 2 : 1;
    const animalStartY = CFG.escapeRows - animalH;
    const blocks = [
      { id: 0, x: exitX, y: animalStartY, w: CFG.escapeExitWidth, h: animalH, animal: true, emoji: escapeAnimal.emoji, color: escapeAnimal.color }
    ];

    const positions = [];
    for (let y = 0; y < CFG.escapeRows; y++) {
      for (let x = 0; x < CFG.escapeCols; x++) positions.push({ x, y });
    }
    const gateRow = animalStartY - 1;
    let nextId = 1;
    const targetObstacleCount = CFG.escapeObstacleTargetMin + Math.floor(Math.random() * CFG.escapeObstacleTargetRange);

    for (const pos of shuffledCopy(positions)) {
      if (blocks.length > targetObstacleCount) break;
      const shape = obstaclePool[Math.floor(Math.random() * obstaclePool.length)];
      if (pos.x + shape.w > CFG.escapeCols || pos.y + shape.h > CFG.escapeRows) continue;
      if (pos.x < exitX + CFG.escapeExitWidth && pos.x + shape.w > exitX) continue;
      if (escapeLayoutOccupied(blocks, -1, pos.x, pos.y, shape.w, shape.h)) continue;
      blocks.push({ id: nextId++, x: pos.x, y: pos.y, w: shape.w, h: shape.h, emoji: shape.emoji, color: shape.color });
    }

    const scrambled = cloneEscapeBlocks(blocks);
    while (applyEscapeLayoutMove(scrambled, 0, 'up')) {}

    let lastMove = '';
    const scrambleMoves = CFG.escapeScrambleMin + Math.floor(Math.random() * CFG.escapeScrambleRange);
    for (let step = 0; step < scrambleMoves; step++) {
      const options = [];
      for (const b of scrambled) {
        if (b.animal) continue;
        for (const dir of dirs) {
          const key = `${b.id}:${dir}`;
          if (key === lastMove) continue;
          if (canMoveEscapeLayout(scrambled, b.id, dir)) options.push({ id: b.id, dir });
        }
      }
      if (!options.length) break;
      const pick = options[Math.floor(Math.random() * options.length)];
      applyEscapeLayoutMove(scrambled, pick.id, pick.dir);
      const reverse = { left: 'right', right: 'left', up: 'down', down: 'up' }[pick.dir];
      lastMove = `${pick.id}:${reverse}`;
    }

    const signature = escapeLayoutSignature(scrambled);
    const difference = escapeLayoutDifference(signature, previousSignature);
    const animalBlock = scrambled.find(b => b.animal);
    if (animalBlock && animalBlock.y === 0) {
      const candidate = { blocks: cloneEscapeBlocks(scrambled), animalIndex, signature, difference };
      if (!bestCandidate || candidate.difference > bestCandidate.difference) bestCandidate = candidate;
    }
    if (escapeCandidateIsInteresting(scrambled) && (!previousSignature || difference >= 4)) {
      ST.escapeLastAnimal = animalIndex;
      ST.escapeLastLayoutSignature = signature;
      return scrambled;
    }
  }

  return [
    { id: 0, x: 1, y: 0, w: 2, h: 1, animal: true, emoji: '🐼', color: '#ffafcc' },
    { id: 1, x: 0, y: 0, w: 1, h: 2, emoji: '🪵', color: '#b08968' },
    { id: 2, x: 3, y: 0, w: 1, h: 2, emoji: '🌳', color: '#90be6d' },
    { id: 3, x: 1, y: 1, w: 1, h: 1, emoji: '🪨', color: '#adb5bd' },
    { id: 4, x: 2, y: 1, w: 1, h: 1, emoji: '🍄', color: '#f28482' },
    { id: 5, x: 0, y: 2, w: 1, h: 1, emoji: '🧱', color: '#e76f51' },
    { id: 6, x: 3, y: 2, w: 1, h: 1, emoji: '🌿', color: '#52b788' },
    { id: 7, x: 1, y: 3, w: 1, h: 1, emoji: '🪨', color: '#adb5bd' },
    { id: 8, x: 2, y: 3, w: 1, h: 1, emoji: '🪵', color: '#b08968' }
  ];
}
