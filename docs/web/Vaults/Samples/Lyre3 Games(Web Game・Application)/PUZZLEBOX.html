function solveEscapeLayout(startBlocks, minMoves = 0) {
  const exitX = Math.floor((CFG.escapeCols - CFG.escapeExitWidth) / 2);
  const maxStates = CFG.escapeSolverMaxStates || 12000;
  const maxDepth = 80;
  const dirs = ['left', 'right', 'up', 'down'];
  const start = cloneEscapeBlocks(startBlocks);
  const keyOf = blocks => blocks
    .slice()
    .sort((a, b) => a.id - b.id)
    .map(b => `${b.x},${b.y}`)
    .join('|');

  const queue = [{ blocks: start, depth: 0 }];
  const seen = new Set([keyOf(start)]);
  let head = 0;

  while (head < queue.length && seen.size <= maxStates) {
    const cur = queue[head++];
    const animal = cur.blocks.find(b => b.animal);
    if (animal && animal.x === exitX && animal.w === CFG.escapeExitWidth && animal.y + animal.h >= CFG.escapeRows) {
      return { solvable: true, moves: cur.depth, strongEnough: cur.depth >= minMoves };
    }
    if (cur.depth >= maxDepth) continue;

    for (const b of cur.blocks) {
      for (const dir of dirs) {
        const next = cloneEscapeBlocks(cur.blocks);
        if (!applyEscapeLayoutMove(next, b.id, dir)) continue;
        const key = keyOf(next);
        if (seen.has(key)) continue;
        seen.add(key);
        queue.push({ blocks: next, depth: cur.depth + 1 });
      }
    }
  }

  return { solvable: false, moves: Infinity, strongEnough: false };
}

function makeEscapePieceSpecs(forcedExtraKind = null) {
  const lShapes = [
    { w: 2, h: 2, cells: [{ x: 0, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 1 }] },
    { w: 2, h: 2, cells: [{ x: 1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 1 }] },
    { w: 2, h: 2, cells: [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 0, y: 1 }] },
    { w: 2, h: 2, cells: [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 1, y: 1 }] }
  ];
  const l = lShapes[Math.floor(Math.random() * lShapes.length)];
  const specs = [
    { kind: 'square2', w: 2, h: 2, emoji: '🪨', color: '#8d99ae' },
    { kind: 'v2', w: 1, h: 2, emoji: '🪵', color: '#b08968' },
    { kind: 'h2', w: 2, h: 1, emoji: '🧱', color: '#e76f51' }
  ];
  const extraKinds = ['square2', 'v2', 'h2'];
  let extraKind = forcedExtraKind || extraKinds[Math.floor(Math.random() * extraKinds.length)];
  if (!forcedExtraKind && extraKinds.length > 1 && ST.escapeLastExtraKind === extraKind) {
    const options = extraKinds.filter(k => k !== ST.escapeLastExtraKind);
    extraKind = options[Math.floor(Math.random() * options.length)];
  }
  ST.escapeLastExtraKind = extraKind;
  if (extraKind === 'square2') specs.push({ kind: 'square2', w: 2, h: 2, emoji: '🪨', color: '#8d99ae' });
  else if (extraKind === 'v2') specs.push({ kind: 'v2', w: 1, h: 2, emoji: '🪵', color: '#b08968' });
  else specs.push({ kind: 'h2', w: 2, h: 1, emoji: '🧱', color: '#e76f51' });
  const singles = CFG.escapeSingleBlockCount || 3;
  const singleIcons = [
    { emoji: '🍄', color: '#f28482' },
    { emoji: '🌳', color: '#90be6d' },
    { emoji: '🪨', color: '#adb5bd' },
    { emoji: '🪵', color: '#b08968' }
  ];
  for (let i = 0; i < singles; i++) {
    const icon = singleIcons[i % singleIcons.length];
    specs.push({ kind: 'single', w: 1, h: 1, cells: [{ x: 0, y: 0 }], emoji: icon.emoji, color: icon.color });
  }
  return specs;
}

function buildChallengeEscapePuzzle() {
  const escapeAnimals = [
    { emoji: '🐼', color: '#ffafcc' },
    { emoji: '🦊', color: '#f4a261' },
    { emoji: '🐰', color: '#f7cad0' },
    { emoji: '🐸', color: '#90be6d' },
    { emoji: '🐱', color: '#ffd166' },
    { emoji: '🐶', color: '#bde0fe' },
    { emoji: '🐨', color: '#cdb4db' },
    { emoji: '🐯', color: '#ffb703' }
  ];
  const exitX = Math.floor((CFG.escapeCols - CFG.escapeExitWidth) / 2);
  const minMoves = CFG.escapeMinSolutionMoves || 8;
  let best = null;

  for (let attempt = 0; attempt < (CFG.escapeBuildAttempts || 260); attempt++) {
    let animalIndex = Math.floor(Math.random() * escapeAnimals.length);
    if (escapeAnimals.length > 1 && ST.escapeLastAnimal === animalIndex) {
      animalIndex = (animalIndex + 1 + Math.floor(Math.random() * (escapeAnimals.length - 1))) % escapeAnimals.length;
    }
    const animal = escapeAnimals[animalIndex];
    const blocks = [
      { id: 0, x: exitX, y: 0, w: CFG.escapeExitWidth, h: 1, cells: [{ x: 0, y: 0 }, { x: 1, y: 0 }], animal: true, emoji: animal.emoji, color: animal.color }
    ];
    const specs = makeEscapePieceSpecs();
    let nextId = 1;
    let failed = false;

    for (const spec of specs) {
      let placed = false;
      for (let t = 0; t < 90 && !placed; t++) {
        const x = Math.floor(Math.random() * (CFG.escapeCols - spec.w + 1));
        const y = Math.floor(Math.random() * (CFG.escapeRows - spec.h + 1));
        if (escapeLayoutOccupied(blocks, -1, x, y, spec.w, spec.h, spec.cells)) continue;
        blocks.push({ id: nextId++, x, y, w: spec.w, h: spec.h, cells: spec.cells ? spec.cells.map(c => ({ ...c })) : undefined, emoji: spec.emoji, color: spec.color, kind: spec.kind });
        placed = true;
      }
      if (!placed) {
        failed = true;
        break;
      }
    }
    if (failed) continue;

    const blockersBelow = escapeOccupiedCellCount(blocks, 1, 1, CFG.escapeExitWidth, CFG.escapeRows - 1, 0);
    if (blockersBelow < CFG.escapeMinBlockersBelow) continue;

    const solved = solveEscapeLayout(blocks, minMoves);
    if (!solved.solvable) continue;
    const candidate = { blocks: cloneEscapeBlocks(blocks), moves: solved.moves, animalIndex };
    if (!best || solved.moves > best.moves) best = candidate;
    if (solved.strongEnough) {
      ST.escapeLastAnimal = animalIndex;
      return cloneEscapeBlocks(blocks);
    }
  }

  if (best) {
    ST.escapeLastAnimal = best.animalIndex;
    return cloneEscapeBlocks(best.blocks);
  }
  return buildGeneratedEscapePuzzle();
}

function buildReverseScrambledEscapePuzzle() {
  const escapeAnimals = [
    { emoji: '🐼', color: '#ffafcc' },
    { emoji: '🦊', color: '#f4a261' },
    { emoji: '🐰', color: '#f7cad0' },
    { emoji: '🐸', color: '#90be6d' },
    { emoji: '🐱', color: '#ffd166' },
    { emoji: '🐶', color: '#bde0fe' },
    { emoji: '🐨', color: '#cdb4db' },
    { emoji: '🐯', color: '#ffb703' }
  ];
  const dirs = ['left', 'right', 'up', 'down'];
  const reverseDir = { left: 'right', right: 'left', up: 'down', down: 'up' };
  const exitX = Math.floor((CFG.escapeCols - CFG.escapeExitWidth) / 2);
  const maxAttempts = CFG.escapeBuildAttempts || 90;
  const extraKinds = ['square2', 'v2', 'h2'];
  let puzzleExtraKind = extraKinds[Math.floor(Math.random() * extraKinds.length)];
  if (extraKinds.length > 1 && ST.escapeLastExtraKind === puzzleExtraKind) {
    const options = extraKinds.filter(k => k !== ST.escapeLastExtraKind);
    puzzleExtraKind = options[Math.floor(Math.random() * options.length)];
  }
  ST.escapeLastExtraKind = puzzleExtraKind;
  const previousSignature = ST.escapeLastLayoutSignature || '';
  let bestCandidate = null;

  function rememberEscapeCandidate(blocks, animalIndex) {
    const animalBlock = blocks.find(b => b.animal);
    if (!animalBlock || animalBlock.y !== 0) return null;
    const signature = escapeLayoutSignature(blocks);
    const difference = escapeLayoutDifference(signature, previousSignature);
    let legalMoves = 0;
    for (const block of blocks) {
      for (const dir of dirs) {
        if (canMoveEscapeLayout(blocks, block.id, dir)) legalMoves++;
      }
    }
    const exitBlockers = escapeOccupiedCellCount(blocks, exitX, 1, CFG.escapeExitWidth, CFG.escapeRows - 1, 0);
    const score = difference * 100 + exitBlockers * 10 + legalMoves + Math.random();
    const candidate = { blocks: cloneEscapeBlocks(blocks), animalIndex, signature, difference, score };
    if (!bestCandidate || candidate.score > bestCandidate.score) bestCandidate = candidate;
    return candidate;
  }

  function fallbackReversePuzzle() {
    const fallbackAnimal = escapeAnimals[Math.floor(Math.random() * escapeAnimals.length)];
    return [
      { id: 0, x: 1, y: 0, w: 2, h: 1, cells: [{ x: 0, y: 0 }, { x: 1, y: 0 }], animal: true, emoji: fallbackAnimal.emoji, color: fallbackAnimal.color },
      { id: 1, x: 0, y: 0, w: 1, h: 2, emoji: '🪵', color: '#b08968', kind: 'v2' },
      { id: 2, x: 2, y: 3, w: 2, h: 2, emoji: '🪨', color: '#8d99ae', kind: 'square2' },
      { id: 3, x: 1, y: 2, w: 2, h: 1, emoji: '🧱', color: '#e76f51', kind: 'h2' },
      { id: 4, x: 3, y: 0, w: 1, h: 1, cells: [{ x: 0, y: 0 }], emoji: '🍄', color: '#f28482', kind: 'single' },
      { id: 5, x: 1, y: 1, w: 1, h: 1, cells: [{ x: 0, y: 0 }], emoji: '🌳', color: '#90be6d', kind: 'single' },
      { id: 6, x: 2, y: 1, w: 1, h: 1, cells: [{ x: 0, y: 0 }], emoji: '🪨', color: '#adb5bd', kind: 'single' },
      { id: 7, x: 0, y: 3, w: 1, h: 1, cells: [{ x: 0, y: 0 }], emoji: '🪵', color: '#b08968', kind: 'single' }
    ];
  }

  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    let animalIndex = Math.floor(Math.random() * escapeAnimals.length);
    if (escapeAnimals.length > 1 && ST.escapeLastAnimal === animalIndex) {
      animalIndex = (animalIndex + 1 + Math.floor(Math.random() * (escapeAnimals.length - 1))) % escapeAnimals.length;
    }
    const animal = escapeAnimals[animalIndex];
    const blocks = [
      { id: 0, x: exitX, y: CFG.escapeRows - 1, w: CFG.escapeExitWidth, h: 1, cells: [{ x: 0, y: 0 }, { x: 1, y: 0 }], animal: true, emoji: animal.emoji, color: animal.color }
    ];

    const specs = shuffledCopy(makeEscapePieceSpecs(puzzleExtraKind));
    let nextId = 1;
    let failed = false;

    for (const spec of specs) {
      let placed = false;
      const positions = [];
      for (let y = 0; y <= CFG.escapeRows - spec.h; y++) {
        for (let x = 0; x <= CFG.escapeCols - spec.w; x++) positions.push({ x, y });
      }
      for (const pos of shuffledCopy(positions)) {
        if (escapeLayoutOccupied(blocks, -1, pos.x, pos.y, spec.w, spec.h, spec.cells)) continue;
        blocks.push({
          id: nextId++,
          x: pos.x,
          y: pos.y,
          w: spec.w,
          h: spec.h,
          cells: spec.cells ? spec.cells.map(c => ({ ...c })) : undefined,
          emoji: spec.emoji,
          color: spec.color,
          kind: spec.kind
        });
        placed = true;
        break;
      }
      if (!placed) {
        failed = true;
        break;
      }
    }
    if (failed) continue;

    const scrambled = cloneEscapeBlocks(blocks);
    let lastMove = '';
    const scrambleMoves = CFG.escapeScrambleMin + Math.floor(Math.random() * CFG.escapeScrambleRange);

    for (let step = 0; step < scrambleMoves; step++) {
      const animalBlock = scrambled.find(b => b.animal);
      let pick = null;

      if (animalBlock && animalBlock.y > 0 && canMoveEscapeLayout(scrambled, 0, 'up') && Math.random() < 0.58) {
        pick = { id: 0, dir: 'up' };
      } else {
        const options = [];
        for (const b of scrambled) {
          for (const dir of dirs) {
            if (b.animal && dir !== 'up') continue;
            const key = `${b.id}:${dir}`;
            if (key === lastMove) continue;
            if (canMoveEscapeLayout(scrambled, b.id, dir)) options.push({ id: b.id, dir });
          }
        }
        if (!options.length) break;
        pick = options[Math.floor(Math.random() * options.length)];
      }

      applyEscapeLayoutMove(scrambled, pick.id, pick.dir);
      lastMove = `${pick.id}:${reverseDir[pick.dir]}`;
    }

    for (let lift = 0; lift < CFG.escapeRows; lift++) {
      if (!applyEscapeLayoutMove(scrambled, 0, 'up')) break;
    }

    const extraObstacleMoves = 45 + Math.floor(Math.random() * 36);
    for (let extra = 0; extra < extraObstacleMoves; extra++) {
      const options = [];
      for (const b of scrambled) {
        if (b.animal) continue;
        for (const dir of dirs) {
          if (canMoveEscapeLayout(scrambled, b.id, dir)) options.push({ id: b.id, dir });
        }
      }
      if (!options.length) break;
      const pick = options[Math.floor(Math.random() * options.length)];
      applyEscapeLayoutMove(scrambled, pick.id, pick.dir);
    }

    const candidate = rememberEscapeCandidate(scrambled, animalIndex);
    if (candidate && escapeCandidateIsInteresting(scrambled) && (!previousSignature || candidate.difference >= 3)) {
      ST.escapeLastAnimal = animalIndex;
      ST.escapeLastLayoutSignature = candidate.signature;
      return cloneEscapeBlocks(scrambled);
    }
  }

  if (bestCandidate && (!previousSignature || bestCandidate.difference >= 2)) {
    ST.escapeLastAnimal = bestCandidate.animalIndex;
    ST.escapeLastLayoutSignature = bestCandidate.signature;
    return cloneEscapeBlocks(bestCandidate.blocks);
  }

  const fallback = (() => {
    const fallbackReverse = { left: 'right', right: 'left', up: 'down', down: 'up' };
    let bestFallback = null;

    function makeFallbackBase(animal) {
      return [
        { id: 0, x: 1, y: 0, w: 2, h: 1, cells: [{ x: 0, y: 0 }, { x: 1, y: 0 }], animal: true, emoji: animal.emoji, color: animal.color },
        { id: 1, x: 0, y: 0, w: 1, h: 2, emoji: '🪵', color: '#b08968', kind: 'v2' },
        { id: 2, x: 2, y: 3, w: 2, h: 2, emoji: '🪨', color: '#8d99ae', kind: 'square2' },
        { id: 3, x: 1, y: 2, w: 2, h: 1, emoji: '🧱', color: '#e76f51', kind: 'h2' },
        { id: 4, x: 3, y: 0, w: 1, h: 1, cells: [{ x: 0, y: 0 }], emoji: '🍄', color: '#f28482', kind: 'single' },
        { id: 5, x: 1, y: 1, w: 1, h: 1, cells: [{ x: 0, y: 0 }], emoji: '🌳', color: '#90be6d', kind: 'single' },
        { id: 6, x: 2, y: 1, w: 1, h: 1, cells: [{ x: 0, y: 0 }], emoji: '🪨', color: '#adb5bd', kind: 'single' },
        { id: 7, x: 0, y: 3, w: 1, h: 1, cells: [{ x: 0, y: 0 }], emoji: '🪵', color: '#b08968', kind: 'single' }
      ];
    }

    for (let attempt = 0; attempt < 18; attempt++) {
      let animalIndex = Math.floor(Math.random() * escapeAnimals.length);
      if (escapeAnimals.length > 1 && ST.escapeLastAnimal === animalIndex) {
        animalIndex = (animalIndex + 1 + Math.floor(Math.random() * (escapeAnimals.length - 1))) % escapeAnimals.length;
      }

      const blocks = makeFallbackBase(escapeAnimals[animalIndex]);
      let lastFallbackMove = '';
      let appliedMoves = 0;
      const moveTarget = 24 + Math.floor(Math.random() * 36);

      for (let step = 0; step < moveTarget; step++) {
        const options = [];
        for (const block of blocks) {
          if (block.animal) continue;
          for (const dir of dirs) {
            const key = `${block.id}:${dir}`;
            if (key === lastFallbackMove) continue;
            if (canMoveEscapeLayout(blocks, block.id, dir)) options.push({ id: block.id, dir });
          }
        }
        if (!options.length) break;
        const pick = options[Math.floor(Math.random() * options.length)];
        applyEscapeLayoutMove(blocks, pick.id, pick.dir);
        lastFallbackMove = `${pick.id}:${fallbackReverse[pick.dir]}`;
        appliedMoves++;
      }

      const signature = escapeLayoutSignature(blocks);
      const difference = escapeLayoutDifference(signature, previousSignature);
      const candidate = {
        blocks: cloneEscapeBlocks(blocks),
        animalIndex,
        signature,
        difference,
        score: difference * 100 + appliedMoves + Math.random()
      };
      if (!bestFallback || candidate.score > bestFallback.score) bestFallback = candidate;
      if (!previousSignature || difference >= 3) break;
    }

    ST.escapeLastAnimal = bestFallback.animalIndex;
    ST.escapeLastLayoutSignature = bestFallback.signature;
    return cloneEscapeBlocks(bestFallback.blocks);
  })();
  return fallback;
}

function initEscapePuzzle() {
  CFG.gridSize = CFG.escapeCols;
  TILE_COUNT = CFG.escapeCols * CFG.escapeRows;
  ST.escapeBlocks = buildReverseScrambledEscapePuzzle();
  ST.escapeSelected = 0;
  ST.escapeSwipe = null;
  ST.escapeWon = false;
  ST.moves = 0;
  ST.elapsed = 0;
  ST.hoveredBtn = false;
  ST.pressedBtn = false;
}

let escapeBuildTimer = null;
let escapeBuildToken = 0;

function setEscapeLoading(on) {
  const loader = document.getElementById('escapeLoading');
  if (loader && loader.parentElement !== document.body) document.body.appendChild(loader);
  if (loader) loader.classList.toggle('active', !!on);
  document.body.classList.toggle('escape-building', !!on);
}

function cancelEscapeBuild() {
  escapeBuildToken++;
  if (escapeBuildTimer) {
    clearTimeout(escapeBuildTimer);
    escapeBuildTimer = null;
  }
  setEscapeLoading(false);
}

function rebuildEscapePuzzleAsync(onReady) {
  cancelEscapeBuild();
  const token = ++escapeBuildToken;
  setEscapeLoading(true);
  escapeBuildTimer = setTimeout(() => {
    if (token !== escapeBuildToken) return;
    initEscapePuzzle();
    updateLayout();
    escapeBuildTimer = null;
    setEscapeLoading(false);
    if (onReady) onReady();
  }, 40);
}

function startEscapeGameAsync() {
  ST.currentGame = 'escape';
  ST.phase = 'loading';
  updateLayout();
  hideLid();
  document.getElementById('topBtnHtml').style.display = 'flex';
  document.getElementById('pauseBtnHtml').style.display = 'flex';
  document.getElementById('hintBtnHtml').style.display = 'none';
  document.getElementById('winOverlay').classList.remove('active');
  INP.down = false;
  INP.justDown = false;
  INP.justUp = false;
  rebuildEscapePuzzleAsync(() => {
    INP.down = false;
    INP.justDown = false;
    INP.justUp = false;
    ST.phase = 'playing';
  });
}

function requestEscapePuzzleRebuild() {
  if (ST.currentGame !== 'escape') return;
  ST.phase = 'loading';
  ST.escapeSwipe = null;
  ST.pressedBtn = false;
  rebuildEscapePuzzleAsync(() => {
    INP.down = false;
    INP.justDown = false;
    INP.justUp = false;
    ST.phase = 'playing';
  });
}

function escapeGeom() {
  const cols = CFG.escapeCols;
  const rows = CFG.escapeRows;
  const gap = CFG.tileGap;
  const max = ST.layout.boardSize;
  const tile = Math.min((max - gap * (cols + 1)) / cols, (max - gap * (rows + 1)) / rows);
  const w = tile * cols + gap * (cols + 1);
  const h = tile * rows + gap * (rows + 1);
  return { x: ST.layout.boardX + (max - w) / 2, y: ST.layout.boardY + (max - h) / 2, w, h, tile, gap, cols, rows };
}

function escapeBlockAtPointer() {
  const g = escapeGeom();
  for (let i = ST.escapeBlocks.length - 1; i >= 0; i--) {
    const b = ST.escapeBlocks[i];
    const x = g.x + g.gap + b.x * (g.tile + g.gap);
    const y = g.y + g.gap + b.y * (g.tile + g.gap);
    const w = b.w * g.tile + (b.w - 1) * g.gap;
    const h = b.h * g.tile + (b.h - 1) * g.gap;
    if (escapePointerHitsBlock(b, g)) return b.id;
  }
  return -1;
}

function escapeOccupied(blockId, x, y, w, h, cells = null) {
  const moving = { x, y, w, h, cells };
  for (const b of ST.escapeBlocks) {
    if (b.id === blockId) continue;
    if (escapeBlocksOverlap(moving, x, y, b, b.x, b.y)) return true;
  }
  return false;
}

function moveEscapeBlock(id, dir) {
  if (ST.phase !== 'playing' || ST.escapeWon) return false;
  const b = ST.escapeBlocks.find(x => x.id === id);
  if (!b) return false;
  let dx = 0, dy = 0;
  if (dir === 'left') dx = -1;
  if (dir === 'right') dx = 1;
  if (dir === 'up') dy = -1;
  if (dir === 'down') dy = 1;

  const nx = b.x + dx;
  const ny = b.y + dy;
  const exitX = Math.floor((CFG.escapeCols - CFG.escapeExitWidth) / 2);

  if (b.animal && dir === 'down' && b.y + b.h >= CFG.escapeRows && b.x === exitX && b.w === CFG.escapeExitWidth) {
    ST.escapeWon = true;
    ST.moves++;
    setTimeout(triggerEscapeWin, 160);
    return true;
  }
  if (nx < 0 || nx + b.w > CFG.escapeCols || ny < 0 || ny + b.h > CFG.escapeRows) return false;
  if (escapeOccupied(b.id, nx, ny, b.w, b.h, b.cells)) return false;

  b.x = nx;
  b.y = ny;
  ST.escapeSelected = b.id;
  ST.moves++;
  playMove();
  return true;
}

function triggerEscapeWin() {
  if (ST.phase === 'victory') return;
  ST.phase = 'victory';
  playWin();
  spawnConfetti();
  showClearThenResults(() => saveAndShowSimpleWin('animalescape_top5', 'ANIMAL ESCAPED!', 'BEST ANIMAL ESCAPE'));
}

function updateEscapeLogic(dt) {
  if (ST.phase === 'playing') ST.elapsed += dt;
  updateConfetti();
  updateMenuBoard(dt);
  updateParticles(dt);

  const b = ST.layout.shuffleBtn;
  ST.hoveredBtn = false;

  if (ST.phase === 'playing') {
    if (INP.x >= b.x && INP.x <= b.x + b.w && INP.y >= b.y && INP.y <= b.y + b.h) {
      ST.hoveredBtn = true;
      if (INP.justDown) {
        ST.pressedBtn = true;
        requestEscapePuzzleRebuild();
      }
    } else {
      if (INP.justDown) {
        const id = escapeBlockAtPointer();
        if (id >= 0) {
          ST.escapeSelected = id;
          ST.escapeSwipe = { x: INP.x, y: INP.y, id };
        }
      }
      if (INP.justUp && ST.escapeSwipe) {
        const dx = INP.x - ST.escapeSwipe.x;
        const dy = INP.y - ST.escapeSwipe.y;
        if (Math.max(Math.abs(dx), Math.abs(dy)) > 25) {
          if (Math.abs(dx) > Math.abs(dy)) moveEscapeBlock(ST.escapeSwipe.id, dx > 0 ? 'right' : 'left');
          else moveEscapeBlock(ST.escapeSwipe.id, dy > 0 ? 'down' : 'up');
        }
        ST.escapeSwipe = null;
      }
    }
  }

  if (!INP.down) ST.pressedBtn = false;
  INP.justDown = false;
  INP.justUp = false;
}

function escapePointerHitsBlock(b, g) {
  for (const cell of escapeShapeCells(b)) {
    const x = g.x + g.gap + (b.x + cell.x) * (g.tile + g.gap);
    const y = g.y + g.gap + (b.y + cell.y) * (g.tile + g.gap);
    if (INP.x >= x && INP.x <= x + g.tile && INP.y >= y && INP.y <= y + g.tile) return true;
  }
  return false;
}

function drawEscapeBlockShape(b, g) {
  const cells = escapeShapeCells(b);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

  for (const cell of cells) {
    const x = g.x + g.gap + (b.x + cell.x) * (g.tile + g.gap);
    const y = g.y + g.gap + (b.y + cell.y) * (g.tile + g.gap);
    minX = Math.min(minX, x);
    minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + g.tile);
    maxY = Math.max(maxY, y + g.tile);
    rr(x + 2, y + 8, g.tile, g.tile, CFG.cornerRadius, 'rgba(0,0,0,0.24)');
    rr(x, y, g.tile, g.tile, CFG.cornerRadius, b.color);
    const shine = ctx.createLinearGradient(x, y, x, y + g.tile);
    shine.addColorStop(0, 'rgba(255,255,255,0.4)');
    shine.addColorStop(1, 'rgba(255,255,255,0.04)');
    rr(x, y, g.tile, g.tile, CFG.cornerRadius, shine);

    const hasRight = cells.some(other => other.x === cell.x + 1 && other.y === cell.y);
    const hasDown = cells.some(other => other.x === cell.x && other.y === cell.y + 1);
    if (false && hasRight) {
      ctx.fillStyle = b.color;
      ctx.fillRect(x + g.tile - 1, y, g.gap + 2, g.tile);
      const bridge = ctx.createLinearGradient(x, y, x, y + g.tile);
      bridge.addColorStop(0, 'rgba(255,255,255,0.32)');
      bridge.addColorStop(1, 'rgba(255,255,255,0.03)');
      ctx.fillStyle = bridge;
      ctx.fillRect(x + g.tile - 1, y, g.gap + 2, g.tile);
    }
    if (false && hasDown) {
      ctx.fillStyle = b.color;
      ctx.fillRect(x, y + g.tile - 1, g.tile, g.gap + 2);
      const bridge = ctx.createLinearGradient(x, y, x, y + g.tile + g.gap);
      bridge.addColorStop(0, 'rgba(255,255,255,0.26)');
      bridge.addColorStop(1, 'rgba(255,255,255,0.03)');
      ctx.fillStyle = bridge;
      ctx.fillRect(x, y + g.tile - 1, g.tile, g.gap + 2);
    }
    if (false && b.id === ST.escapeSelected) {
      ctx.save();
      ctx.strokeStyle = '#23395d';
      ctx.lineWidth = 4;
      ctx.strokeRect(x + 3, y + 3, g.tile - 6, g.tile - 6);
      ctx.restore();
    }

  if (b.id === ST.escapeSelected) {
    const hasCell = (cx, cy) => cells.some(other => other.x === cx && other.y === cy);
    ctx.save();
    ctx.strokeStyle = '#23395d';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (const cell of cells) {
      const x = g.x + g.gap + (b.x + cell.x) * (g.tile + g.gap);
      const y = g.y + g.gap + (b.y + cell.y) * (g.tile + g.gap);
      const leftExt = hasCell(cell.x - 1, cell.y) ? g.gap * 0.5 : 0;
      const rightExt = hasCell(cell.x + 1, cell.y) ? g.gap * 0.5 : 0;
      const upExt = hasCell(cell.x, cell.y - 1) ? g.gap * 0.5 : 0;
      const downExt = hasCell(cell.x, cell.y + 1) ? g.gap * 0.5 : 0;
      if (!hasCell(cell.x, cell.y - 1)) { ctx.moveTo(x - leftExt + 4, y + 4); ctx.lineTo(x + g.tile + rightExt - 4, y + 4); }
      if (!hasCell(cell.x + 1, cell.y)) { ctx.moveTo(x + g.tile - 4, y - upExt + 4); ctx.lineTo(x + g.tile - 4, y + g.tile + downExt - 4); }
      if (!hasCell(cell.x, cell.y + 1)) { ctx.moveTo(x + g.tile + rightExt - 4, y + g.tile - 4); ctx.lineTo(x - leftExt + 4, y + g.tile - 4); }
      if (!hasCell(cell.x - 1, cell.y)) { ctx.moveTo(x + 4, y + g.tile + downExt - 4); ctx.lineTo(x + 4, y - upExt + 4); }
    }
    ctx.stroke();
    ctx.restore();
  }
  }

  ctx.save();
  ctx.font = `${Math.min(maxX - minX, maxY - minY, g.tile * 1.25) * 0.48}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(b.emoji, (minX + maxX) / 2, (minY + maxY) / 2 + 1);
  ctx.restore();
}

function drawEscapeUI() {
  ctx.clearRect(0, 0, DW, DH);
  drawGameDescription('Move the blocks and guide the animal to the exit.');
  const { boardX, boardY, boardSize } = ST.layout;
  const g = escapeGeom();

  if (ST.phase !== 'menu') {
    const hdrFont = Math.max(13, Math.min(21, DW * 0.04));
    const hy = ST.layout.headerY;
    ctx.font = `${hdrFont}px 'Denk One',sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.fillStyle = CFG.colors.textNormal;
    ctx.fillText('EXIT ↓', DW * 0.22, hy);
    ctx.fillText(`MOVES ${ST.moves || 0}`, DW * 0.52, hy);
    ctx.fillText(`TIME ${fmtTime(ST.elapsed)}`, DW * 0.80, hy);
  }

  const pad = 12;
  rr(boardX - pad + 4, boardY - pad + 12, boardSize + pad * 2, boardSize + pad * 2, CFG.cornerRadius * 2, CFG.colors.tileShadow);
  rr(boardX - pad, boardY - pad, boardSize + pad * 2, boardSize + pad * 2, CFG.cornerRadius * 2, CFG.colors.boardBg);
  rr(boardX, boardY, boardSize, boardSize, CFG.cornerRadius * 1.5, '#eaf4f4');

  const exitX = Math.floor((CFG.escapeCols - CFG.escapeExitWidth) / 2);
  rr(g.x + g.gap + exitX * (g.tile + g.gap), g.y + g.h - g.gap * 0.35, CFG.escapeExitWidth * g.tile + (CFG.escapeExitWidth - 1) * g.gap, g.gap * 1.6, 8, '#52b788');

  for (let r = 0; r < CFG.escapeRows; r++) {
    for (let c = 0; c < CFG.escapeCols; c++) {
      const x = g.x + g.gap + c * (g.tile + g.gap);
      const y = g.y + g.gap + r * (g.tile + g.gap);
      rr(x, y, g.tile, g.tile, CFG.cornerRadius, 'rgba(255,255,255,0.48)');
    }
  }

  for (const b of ST.escapeBlocks) {

    const x = g.x + g.gap + b.x * (g.tile + g.gap);
    const y = g.y + g.gap + b.y * (g.tile + g.gap);
    const w = b.w * g.tile + (b.w - 1) * g.gap;
    const h = b.h * g.tile + (b.h - 1) * g.gap;
    rr(x + 2, y + 8, w, h, CFG.cornerRadius, 'rgba(0,0,0,0.24)');
    rr(x, y, w, h, CFG.cornerRadius, b.color);
    const shine = ctx.createLinearGradient(x, y, x, y + h);
    shine.addColorStop(0, 'rgba(255,255,255,0.4)');
    shine.addColorStop(1, 'rgba(255,255,255,0.04)');
    rr(x, y, w, h, CFG.cornerRadius, shine);

    ctx.save();
    ctx.font = `${Math.min(w, h) * 0.48}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.emoji, x + w / 2, y + h / 2 + 1);
    if (b.id === ST.escapeSelected) {
      ctx.strokeStyle = '#23395d';
      ctx.lineWidth = 4;
      ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);
    }
    ctx.restore();
  }

  if (ST.phase === 'playing') {
    const b = ST.layout.shuffleBtn;
    const yo = ST.pressedBtn ? 4 : 0;
    if (!ST.pressedBtn) rr(b.x, b.y + 4, b.w, b.h, CFG.cornerRadius, CFG.colors.btnShadow);
    rr(b.x, b.y + yo, b.w, b.h, CFG.cornerRadius, ST.hoveredBtn ? CFG.colors.btnHover : CFG.colors.btnBg);
    ctx.fillStyle = '#ffffff';
    ctx.font = `${Math.max(12, Math.min(18, DW * 0.036))}px 'Denk One',sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = CFG.themeStyle === 'minimal' ? CFG.colors.tileText : ctx.fillStyle;
    ctx.fillText('NEW PUZZLE', b.x + b.w / 2, b.y + b.h / 2 + yo + 1);

    ctx.fillStyle = CFG.colors.textNormal;
    ctx.font = `${Math.max(12, Math.min(16, DW * 0.032))}px sans-serif`;
    ctx.fillText('Click a block, then swipe or use WASD / Arrow Keys', DW / 2, b.y + b.h + 28);
  }
}

// ============================================================
// GAME LOOP
// ============================================================
let lastT=performance.now();
function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  const dt=Math.min((ts-lastT)/1000,0.05); lastT=ts;
  updateLogic(dt); drawUI();
}

// ============================================================
// INIT
// ============================================================
function hideLid() {
  const lid=document.getElementById('lidOverlay');
  lid.style.opacity='0'; lid.style.pointerEvents='none';
  setTimeout(()=>lid.style.display='none',500);
}
function showLid() {
  const lid=document.getElementById('lidOverlay');
  lid.style.display='flex';
  setTimeout(()=>{lid.style.opacity='1';lid.style.pointerEvents='auto';},10);

}

function resetToMenu() {
  cancelEscapeBuild();
  ST.phase='menu'; ST.animations=[]; ST.drag=null;
  cancelClearOverlay();
  document.getElementById('pauseOverlay').classList.remove('active');
  document.getElementById('winOverlay').classList.remove('active');
  document.getElementById('topBtnHtml').style.display='none';
  document.getElementById('pauseBtnHtml').style.display='none';
  document.getElementById('hintBtnHtml').style.display='none';
  ST.currentGame='animal';
  document.querySelector('.lid-title-text').innerText='PUZZLE BOX';
  document.getElementById('menuSubtitle').style.display='block';
  document.getElementById('gameSelect').style.display='grid';
  document.getElementById('levelSelect').style.display='none';
  document.getElementById('menuBackBtn').style.display='none';
  showLid(); initSolved(); ST.moves=0; ST.elapsed=0;
}

function beginGame(size) {
  ST.currentGame='animal';
  CFG.gridSize=size; TILE_COUNT=size*size;
  initSolved(); updateLayout(); hideLid();
  document.getElementById('topBtnHtml').style.display='flex';
  document.getElementById('pauseBtnHtml').style.display='flex';
  document.getElementById('hintBtnHtml').style.display='flex';
  shuffleBoard();
  INP.down = false;
  INP.justDown = false;
  INP.justUp = false;
  ST.press = null;
  ST.phase='playing';
}

function init() {
function beginMergeGame() {
  ST.currentGame='merge';
  initMergeBoard(); updateLayout(); hideLid();
  document.getElementById('topBtnHtml').style.display='flex';
  document.getElementById('pauseBtnHtml').style.display='flex';
  document.getElementById('hintBtnHtml').style.display='none';
  document.getElementById('winOverlay').classList.remove('active');
  INP.down = false;
  INP.justDown = false;
  INP.justUp = false;
  ST.phase='playing';
}

function beginNumberGame() {
  ST.currentGame='number';
  initNumberPuzzle(); updateLayout(); hideLid();
  document.getElementById('topBtnHtml').style.display='flex';
  document.getElementById('pauseBtnHtml').style.display='flex';
  document.getElementById('hintBtnHtml').style.display='none';
  document.getElementById('winOverlay').classList.remove('active');
  INP.down = false;
  INP.justDown = false;
  INP.justUp = false;
  ST.phase='playing';
}

function beginEscapeGame() {
  ST.currentGame='escape';
  initEscapePuzzle(); updateLayout(); hideLid();
  document.getElementById('topBtnHtml').style.display='flex';
  document.getElementById('pauseBtnHtml').style.display='flex';
  document.getElementById('hintBtnHtml').style.display='none';
  document.getElementById('winOverlay').classList.remove('active');
  INP.down = false;
  INP.justDown = false;
  INP.justUp = false;
  ST.phase='playing';
}

  document.querySelectorAll('.game-choice').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const game=e.currentTarget.dataset.game;
      if(game==='animal'){
        document.querySelector('.lid-title-text').innerHTML='ANIMAL HUNT<br />';
        document.getElementById('menuSubtitle').style.display='none';
        document.getElementById('gameSelect').style.display='none';
        document.getElementById('levelSelect').style.display='flex';
        document.getElementById('menuBackBtn').style.display='block';
      } else if(game==='merge') {
        beginMergeGame();
      } else if(game==='number') {
        beginNumberGame();
      } else if(game==='escape') {
        startEscapeGameAsync();
      }
    });
  });

  document.querySelectorAll('.level-btn').forEach(btn=>{
    btn.addEventListener('click',e=>beginGame(parseInt(e.target.dataset.size)));
  });

  document.getElementById('menuBackBtn').addEventListener('click',()=>{
    document.querySelector('.lid-title-text').innerText='PUZZLE BOX';
    document.getElementById('menuSubtitle').style.display='block';
    document.getElementById('gameSelect').style.display='grid';
    document.getElementById('levelSelect').style.display='none';
    document.getElementById('menuBackBtn').style.display='none';
  });

  document.getElementById('pauseBtnHtml').addEventListener('click',()=>{
    if(ST.phase==='playing'){ST.phase='paused';document.getElementById('pauseOverlay').classList.add('active');}
  });
  document.getElementById('topBtnHtml').addEventListener('click',resetToMenu);
  document.getElementById('resumeBtnHtml').addEventListener('click',()=>{
    ST.phase='playing';document.getElementById('pauseOverlay').classList.remove('active');
  });
  document.getElementById('clearOverlay').addEventListener('click', finishClearOverlay);
  document.getElementById('mainMenuBtnHtml').addEventListener('click',resetToMenu);

  document.getElementById('winNewGameBtn').addEventListener('click',()=>{
    document.getElementById('winOverlay').classList.remove('active');
    if (ST.currentGame === 'merge') beginMergeGame();
    else if (ST.currentGame === 'number') beginNumberGame();
    else if (ST.currentGame === 'escape') startEscapeGameAsync();
    else { shuffleBoard(); ST.phase='playing'; }
  });
  document.getElementById('winMainMenuBtn').addEventListener('click',()=>{
    document.getElementById('winOverlay').classList.remove('active');
    resetToMenu();
  });

  document.getElementById('settingsBtnHtml').addEventListener('click',()=>{
    document.getElementById('settingsOverlay').classList.add('active');
  });
  document.getElementById('closeSettingsBtnHtml').addEventListener('click',()=>{
    document.getElementById('settingsOverlay').classList.remove('active');
  });

  const soundToggle=document.getElementById('soundToggle');
  soundToggle.classList.add('on');
  soundToggle.addEventListener('click',()=>{
    CFG.soundOn=!CFG.soundOn; soundToggle.classList.toggle('on',CFG.soundOn);
  });

  const hintToggle=document.getElementById('hintToggle');
  hintToggle.addEventListener('click',()=>{
    CFG.hintOn=!CFG.hintOn; hintToggle.classList.toggle('on',CFG.hintOn);
    document.getElementById('hintBtnHtml').style.opacity=CFG.hintOn?'1':'0.5';
    playHint();
  });

  document.getElementById('hintBtnHtml').addEventListener('click',()=>{
    CFG.hintOn=!CFG.hintOn;
    document.getElementById('hintBtnHtml').style.opacity=CFG.hintOn?'1':'0.5';
    hintToggle.classList.toggle('on',CFG.hintOn);
    playHint();
  });

  document.querySelectorAll('.theme-btn').forEach(btn=>{
    btn.addEventListener('click',e=>applyTheme(e.target.dataset.theme));
  });

  window.addEventListener('resize',resize);
  resize(); initSolved(); initMenuBoard();  initParticles(DW,DH);
  requestAnimationFrame(gameLoop);
}

document.fonts.ready.then(init);
</script>
