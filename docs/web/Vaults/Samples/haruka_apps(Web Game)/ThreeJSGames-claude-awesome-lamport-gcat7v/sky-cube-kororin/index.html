<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#7fb4ff">
  <meta name="description" content="そらキューブ ころりん — かべを ぽちっとすると そこが「した」に なる! 3D じゅうりょく アクション。 / SKY CUBE KORORIN — tap any wall and it becomes the floor! A 3D gravity-flip action game by haruka_apps.">
  <meta name="author" content="haruka_apps">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>そらキューブ ころりん | SKY CUBE KORORIN</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" aria-label="game"></canvas>

    <!-- シーンごとの HTML UI はここに差し込まれる -->
    <div id="ui-root"></div>

    <!-- スマホ用タッチ操作 -->
    <div id="touch-root" aria-hidden="true"></div>

    <!-- 字幕 -->
    <div id="subtitle-root" aria-live="polite"></div>

    <!-- 画面切り替えフェード -->
    <div id="fader"></div>

    <!-- 起動画面(よみこみ → タップして はじめる) -->
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-logo">
          <span class="boot-star">★</span>
          <span class="boot-title">そらキューブ ころりん</span>
          <span class="boot-sub">SKY CUBE KORORIN</span>
        </div>
        <div class="boot-bar"><div class="boot-bar-fill" id="boot-bar-fill"></div></div>
        <div class="boot-msg" id="boot-msg">よみこみちゅう… / Loading…</div>
        <button class="boot-start hidden" id="boot-start" type="button">タップして はじめる</button>
        <div class="boot-note" id="boot-note">🔊 おとが でます / Sound ON</div>
      </div>
      <div class="boot-copy">© 2026 haruka_apps</div>
    </div>

    <noscript>
      <div class="noscript">JavaScript を オンにしてね。 / Please enable JavaScript.</div>
    </noscript>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
