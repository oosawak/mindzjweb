<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12081f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="author" content="haruka_apps">
<meta name="description" content="イカサマ☆雀姫 — CHEAT JANKI! 無法地帯の3D麻雀。全員イカサマし放題、卓は大回転、役はでっち上げ！ / A 3D mahjong game where cheating is the point. by haruka_apps">
<title>イカサマ☆雀姫 — CHEAT JANKI!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=2">
<link rel="stylesheet" href="css/cheat.css?v=3">
</head>
<body>
<div id="app">
  <div id="scene"></div>

  <!-- ===== 対局HUD ===== -->
  <div id="hud" class="hidden">
    <div id="seats"></div>
    <div id="topbar">
      <div id="round-info"></div>
      <div id="dora-box"></div>
    </div>
    <div id="topbtns">
      <button class="icon-btn auto" id="btn-auto" data-i18n-title="hud.auto">A</button>
      <button class="icon-btn" data-modal="howto" data-i18n-title="hud.howto">?</button>
      <button class="icon-btn" data-modal="settings" data-i18n-title="hud.settings">⚙</button>
      <button class="icon-btn" id="btn-quit" data-i18n-title="hud.quit">✕</button>
    </div>
    <div id="cheat-dock">
      <div id="words"></div>
      <div id="gauge"><span class="gauge-label"></span><span class="pips"></span><b class="gauge-val"></b></div>
      <div id="cheatbar"></div>
      <div id="flip-ind"></div>
    </div>
    <div id="hint"></div>
    <div id="hint-hover"></div>
    <div id="actions"></div>
    <div id="danger-layer"></div>
  </div>

  <!-- ===== タイトル ===== -->
  <section class="screen" id="title">
    <div class="title-bg"></div>
    <div id="title-chars"></div>
    <div class="title-main">
      <div class="logo">
        <div class="logo-sub" data-i18n="title.sub">やっちゃいけない3D麻雀</div>
        <h1><span class="l1">イカサマ</span><span class="star">☆</span><span class="l2">雀姫</span></h1>
        <div class="logo-en">CHEAT JANKI!</div>
      </div>
      <div class="title-menu">
        <button class="btn big primary" data-go="setup" data-i18n="title.start">▶ 対局スタート</button>
        <button class="btn" data-modal="howto" data-i18n="title.howto">遊び方</button>
        <button class="btn" data-modal="settings" data-i18n="title.settings">設定</button>
        <button class="btn" data-modal="credits" data-i18n="title.credits">クレジット</button>
      </div>
      <div class="title-foot"><span id="title-record"></span></div>
    </div>
    <button class="btn tiny" id="btn-lang" data-i18n="title.lang">English</button>
    <div class="title-copy">© 2026 haruka_apps</div>
    <div class="tap-hint">クリックでサウンドON</div>
  </section>

  <!-- ===== 対局設定 ===== -->
  <section class="screen" id="setup">
    <div class="panel-head"><button class="btn back" data-go="title" data-i18n="setup.back">← 戻る</button><h2 data-i18n="setup.title">対局設定</h2></div>
    <div class="setup-grid">
      <div class="setup-left">
        <div class="lbl" data-i18n="setup.you">あなたのキャラ</div>
        <div id="me-card"></div>
        <div class="lbl" data-i18n="setup.outfit">衣装</div>
        <div id="outfit-seg" class="seg"></div>
        <div class="lbl" data-i18n="setup.charPick">キャラを選ぶ</div>
        <div id="char-grid"></div>
      </div>
      <div class="setup-right">
        <div class="lbl" data-i18n="setup.players">人数</div>
        <div class="seg" data-key="mode"><button data-val="4p" data-i18n="setup.p4">4人麻雀</button><button data-val="3p" data-i18n="setup.p3">3人麻雀（北抜き）</button></div>
        <div class="note" id="setup-note"></div>
        <div class="lbl"><span data-i18n="setup.opps">対戦相手</span> <button class="btn tiny" id="setup-shuffle" data-i18n="setup.shuffle">シャッフル</button></div>
        <div id="setup-opps"></div>
        <button class="btn big primary" id="setup-start" data-i18n="setup.start">対局開始！</button>
      </div>
    </div>
  </section>

  <section class="screen" id="game"></section>

  <!-- ===== モーダル ===== -->
  <div class="modal" id="settings"><div class="modal-box">
    <h3 data-i18n="set.title">設定</h3>
    <label><span data-i18n="set.lang">表示言語</span> <select id="set-lang"><option value="auto" data-i18n="set.auto">自動</option><option value="ja">日本語</option><option value="en">English</option></select></label>
    <label><span data-i18n="set.master">全体音量</span> <input type="range" id="set-master" min="0" max="1" step="0.05"></label>
    <label><span data-i18n="set.bgm">BGM</span> <input type="range" id="set-bgm" min="0" max="1" step="0.05"></label>
    <label><span data-i18n="set.sfx">効果音</span> <input type="range" id="set-sfx" min="0" max="1" step="0.05"></label>
    <label><span data-i18n="set.voice">ボイス</span> <input type="range" id="set-voice" min="0" max="1" step="0.05"></label>
    <div class="set-row"><label class="chk"><input type="checkbox" id="set-voiceon"> <span data-i18n="set.voiceOn">キャラボイス</span></label><button type="button" class="btn tiny" id="set-test" data-i18n="set.test">試聴 ▶</button></div>
    <label><span data-i18n="set.voiceLang">ボイスの言語</span> <select id="set-voicelang"><option value="follow" data-i18n="set.follow">表示言語に合わせる</option><option value="ja">日本語</option><option value="en">English</option></select></label>
    <div class="set-note" id="set-soundinfo"></div>
    <label><span data-i18n="set.speed">演出スピード</span> <select id="set-speed"><option value="0.75" data-i18n="set.slow">ゆっくり</option><option value="1" data-i18n="set.normal">ふつう</option><option value="1.5" data-i18n="set.fast">はやい</option><option value="2" data-i18n="set.faster">さらに速い</option></select></label>
    <label class="chk"><input type="checkbox" id="set-assist"> <span data-i18n="set.assist">アシスト</span></label>
    <label class="chk"><input type="checkbox" id="set-autoskip"> <span data-i18n="set.autoskip">鳴きを自動でスキップ</span></label>
    <label class="chk"><input type="checkbox" id="set-tapconfirm"> <span data-i18n="set.tapconfirm">タッチ操作</span></label>
    <label class="chk"><input type="checkbox" id="set-lite"> <span data-i18n="set.lite">軽量モード</span></label>
    <div class="settings-footer">
      <button type="button" class="btn tiny danger" id="set-reset">セーブ初期化</button>
      <button type="button" class="btn primary" data-close data-i18n="set.close">閉じる</button>
    </div>
  </div></div>

  <div class="modal" id="howto"><div class="modal-box wide">
    <h3 data-i18n="howto.title">遊び方</h3>
    <div id="howto-body"></div>
    <div class="modal-btns"><button class="btn primary" data-close data-i18n="set.close">閉じる</button></div>
  </div></div>

  <div class="modal" id="credits"><div class="modal-box wide">
    <h3 data-i18n="cred.title">クレジット</h3>
    <div id="credits-body"></div>
    <div class="modal-btns"><button class="btn" id="cred-roll" data-i18n="cred.roll">スタッフロール</button><button class="btn primary" data-close data-i18n="set.close">閉じる</button></div>
  </div></div>

  <div class="overlay" id="result"><div class="result-box"><div id="result-body"></div><button class="btn big primary" id="result-next">次へ ▶</button></div></div>
  <div class="overlay" id="final"><div class="result-box final"><div id="final-body"></div></div></div>
  <div class="overlay" id="banned"><div class="result-box banned"><div id="banned-body"></div></div></div>
  <div class="overlay" id="roll"></div>

  <div id="fx-layer"><canvas id="fx-canvas"></canvas></div>
  <div id="loading"><div class="ld-logo">イカサマ☆雀姫</div><div class="ld-bar"><i></i></div></div>
</div>

<!-- 3D -->
<script src="vendor/three.bundle.min.js"></script>
<!-- ルール（UI 非依存） -->
<script src="js/engine/mahjong.js?v=2"></script>
<script src="js/engine/ai.js?v=2"></script>
<script src="js/engine/game.js?v=2"></script>
<script src="js/engine/tile-layout.js?v=2"></script>
<!-- データ -->
<script src="assets/chars/manifest.js?v=2"></script>
<script src="js/data/characters.js?v=2"></script>
<script src="js/data/lines.js?v=2"></script>
<script src="js/data/lines-chaos.js?v=2"></script>
<script src="js/data/cheats.js?v=2"></script>
<script src="js/data/words.js?v=2"></script>
<script src="js/data/chaos.js?v=2"></script>
<script src="js/engine/riot.js?v=2"></script>
<script src="js/data/terms-en.js?v=2"></script>
<script src="js/data/credits.js?v=2"></script>
<!-- 共通 -->
<script src="js/core/i18n.js?v=2"></script>
<script src="js/core/util.js?v=2"></script>
<script src="js/core/save.js?v=2"></script>
<!-- サウンド（ElevenLabs で生成したファイルを assets/audio/ に置くと鳴ります） -->
<script>/* 生成後すぐ反映されるよう、毎回最新の一覧を読む */ document.write('<script src="assets/audio/available.js?t=' + Date.now() + '"><\/script>');</script>
<script src="js/audio/manifest.js?v=2"></script>
<script src="js/audio/audio.js?v=2"></script>
<!-- 描画・演出 -->
<script src="js/render/tiles2d.js?v=2"></script>
<script src="js/ui/fx.js?v=2"></script>
<script src="js/ui/fx-cheat.js?v=2"></script>
<script src="js/render/scene3d.js?v=2"></script>
<script src="js/render/cheat3d.js?v=3"></script>
<!-- 画面 -->
<script src="js/ui/game-ui.js?v=3"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
